<head>

<meta name="robots" content="noindex, nofollow"/>
<link rel="icon" href="../icon-192.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>

<link rel="stylesheet" href="../estilos.css"/>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:'Segoe UI',Arial,sans-serif;background:linear-gradient(180deg,#F8FAFC 0%,#F0F4F9 380px);color:#0a1c35;min-height:100vh}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

<script src="../shared.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const{useState,useEffect,useRef}=React;

const est={
  input:{width:"100%",padding:"13px 15px",border:"1.5px solid #DDE4EE",borderRadius:10,fontSize:15,marginBottom:10,fontFamily:"inherit"},
  card:{background:"#fff",borderRadius:16,padding:22,border:"1px solid rgba(16,40,74,.08)",boxShadow:"0 3px 12px rgba(16,28,53,.07), 0 1px 3px rgba(16,28,53,.05)"},
  fila:{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"14px 16px",borderBottom:"1px solid #f1f5f9"},
  linkBtn:{background:"none",border:"none",color:"#53647D",fontSize:13,cursor:"pointer",padding:"4px 8px"},
  badge:(color)=>({display:"inline-block",fontSize:11,fontWeight:700,color,background:color+"1a",borderRadius:7,padding:"3px 9px"})
};

const colorEstatusAgente={pendiente:"#F59E0B",aprobado:"#16a34a",rechazado:"#dc2626"};

function textoEstatusPago(cuenta){
  if(cuenta.estatus_suscripcion==="active"||cuenta.estatus_suscripcion==="trialing"){
    const proximo=cuenta.suscripcion_vigente_hasta?` · próximo cobro ${fecha(cuenta.suscripcion_vigente_hasta.slice(0,10))}`:"";
    return`Suscripción activa (${cuenta.plan_periodo||"—"})${proximo}`;
  }
  // El orden de aquí en adelante tiene que ser el mismo que el de accesoVigente() en shared.js,
  // o el panel diría una cosa y el candado haría otra.
  const ahora=new Date();
  if(cuenta.acceso_extendido_hasta&&ahora<=new Date(cuenta.acceso_extendido_hasta))
    return`Acceso extendido hasta ${fecha(cuenta.acceso_extendido_hasta.slice(0,10))}`;
  if(cuenta.aprobado_en){
    const finPrueba=new Date(new Date(cuenta.aprobado_en).getTime()+30*86400000);
    if(ahora<=finPrueba)return`En prueba — vence ${fecha(finPrueba.toISOString().slice(0,10))}`;
  }
  // past_due / unpaid / canceled son estados reales de Stripe: ya pagó alguna vez pero hoy
  // no está al corriente — no es lo mismo que nunca haber pagado.
  if(cuenta.estatus_suscripcion)
    return`Suscripción ${cuenta.estatus_suscripcion} — sin acceso, revisar en Stripe`;
  return"Sin acceso vigente (sin pagar)";
}

const VARIANTE_BOTON={"#10284A":"btn-navy","#F59E0B":"btn-amber","#53647D":"btn-neutral","#16a34a":"btn-good"};
function Boton({children,onClick,disabled,color="#10284A",type="button"}){
  return <button type={type} onClick={onClick} disabled={disabled} className={`btn ${VARIANTE_BOTON[color]||"btn-navy"}`}>
    {children}
  </button>;
}

// Botón "ver/ocultar" para campos de contraseña — se coloca dentro de un contenedor
// position:relative junto al <input>, con paddingRight en el input para no taparlo.
function BotonVerClave({mostrar,onClick}){
  return <button type="button" onClick={onClick} aria-label={mostrar?"Ocultar contraseña":"Mostrar contraseña"} tabIndex={-1}
    style={{position:"absolute",right:2,top:0,bottom:0,width:38,background:"none",border:"none",cursor:"pointer",color:"#8FA0B4",display:"flex",alignItems:"center",justifyContent:"center"}}>
    {mostrar
      ? <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a21.77 21.77 0 0 1 5.06-6.06M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a21.77 21.77 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
      : <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>}
  </button>;
}

const ALTO_HEADER=54;
function HeaderBar(){
  return <div style={{background:"linear-gradient(135deg,#173863,#0a1c35)",padding:"14px 20px",display:"flex",alignItems:"center",justifyContent:"center",gap:10,height:ALTO_HEADER,boxShadow:"0 2px 14px rgba(10,28,53,.25)"}}>
    <a href="../" style={{color:"#fff",fontWeight:700,fontSize:18,fontFamily:"var(--font-display)",display:"inline-flex",alignItems:"center",gap:8,textDecoration:"none"}}><span className="brand-logo"></span> <span style={{color:"#F59E0B"}}>InsurGest</span></a>
    <span style={{color:"#fff",fontSize:12,fontWeight:600,background:"rgba(255,255,255,.15)",borderRadius:20,padding:"3px 10px"}}>Portal del Fundador</span>
  </div>;
}

function Login(){
  const[email,setEmail]=useState("");
  const[password,setPassword]=useState("");
  const[mostrarClave,setMostrarClave]=useState(false);
  const[error,setError]=useState("");
  const[cargando,setCargando]=useState(false);

  const entrar=async(e)=>{
    e.preventDefault();
    if(!email||!email.includes("@")){setError("Escribe un correo válido.");return;}
    if(!password){setError("Escribe tu contraseña.");return;}
    setError("");setCargando(true);
    const{error}=await sb.auth.signInWithPassword({email:email.trim(),password});
    setCargando(false);
    if(error){
      if(error.message&&error.message.toLowerCase().includes("email not confirmed")){
        setError("Tu correo todavía no está confirmado. Revisa tu bandeja de entrada.");
      }else{
        setError(`Correo o contraseña incorrectos. (${error.message||"sin detalle"})`);
      }
      return;
    }
  };

  return <div style={{minHeight:`calc(100vh - ${ALTO_HEADER}px)`,display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
    <form onSubmit={entrar} style={{background:"#fff",borderRadius:16,padding:28,width:"100%",maxWidth:380,boxShadow:"0 8px 30px rgba(0,0,0,.08)"}}>
      <div style={{fontSize:18,fontWeight:800,marginBottom:20,color:"#10284A"}}>Iniciar sesión</div>
      <input value={email} onChange={e=>setEmail(e.target.value)} placeholder="tu correo" type="email" autoComplete="username" style={est.input}/>
      <div style={{position:"relative"}}>
        <input value={password} onChange={e=>setPassword(e.target.value)} placeholder="tu contraseña" type={mostrarClave?"text":"password"} autoComplete="current-password" style={{...est.input,paddingRight:42,marginBottom:12}}/>
        <BotonVerClave mostrar={mostrarClave} onClick={()=>setMostrarClave(m=>!m)}/>
      </div>
      {error&&<div style={{color:"#dc2626",fontSize:13,marginBottom:10}}>{error}</div>}
      <div style={{width:"100%"}}><Boton type="submit" disabled={cargando}>{cargando?"Entrando...":"Iniciar sesión"}</Boton></div>
    </form>
  </div>;
}

function TarjetaKPI({label,valor,color,grande,onClick}){
  const a11y=onClick?{role:"button",tabIndex:0,onKeyDown:e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();onClick();}}}:{};
  return <div
    {...a11y}
    onClick={onClick}
    onMouseEnter={onClick?e=>{e.currentTarget.style.boxShadow="0 6px 20px rgba(16,40,74,.16)";e.currentTarget.style.transform="translateY(-2px)";}:undefined}
    onMouseLeave={onClick?e=>{e.currentTarget.style.boxShadow=est.card.boxShadow;e.currentTarget.style.transform="none";}:undefined}
    style={{...est.card,textAlign:"center",cursor:onClick?"pointer":"default",transition:"box-shadow .15s ease, transform .15s ease"}}>
    <div style={{fontSize:grande?30:22,fontWeight:700,color:color||"#10284A"}}>{valor}</div>
    <div style={{fontSize:12,color:"#8FA0B4",marginTop:4}}>{label}{onClick?" →":""}</div>
  </div>;
}

// onIrA(vista, filtro) — cambia de pestaña y, si aplica, preselecciona el filtro de esa lista.
// Solo las tarjetas con un listado real detrás llevan onClick; "Clientes", "Pólizas" y "Prima"
// son agregados sin pantalla propia en este panel, así que se quedan sin flecha ni clic.
function Resumen({onIrA}){
  const[r,setR]=useState(null);
  const[error,setError]=useState("");

  useEffect(()=>{
    sb.rpc("admin_resumen").then(({data,error})=>{
      if(error){setError(error.message);return;}
      setR(data);
    });
  },[]);

  if(error)return <div style={{color:"#dc2626",fontSize:13}}>{error}</div>;
  if(!r)return <div style={{color:"#6B7280",fontSize:14}}>Cargando...</div>;

  return <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(140px,1fr))",gap:10,marginBottom:24}}>
    <TarjetaKPI label="Agentes totales" valor={r.agentes_totales} grande onClick={()=>onIrA("agentes","todos")}/>
    <TarjetaKPI label="Agentes aprobados" valor={r.agentes_aprobados} color="#16a34a" onClick={()=>onIrA("agentes","todos")}/>
    <TarjetaKPI label="Afiliaciones de red sin confirmar" valor={r.agentes_red_pendiente} color="#F59E0B" onClick={()=>onIrA("agentes","red_pendiente")}/>
    <TarjetaKPI label="Promotorías" valor={r.promotorias_totales} onClick={()=>onIrA("promotorias","todos")}/>
    <TarjetaKPI label="Promotorías pendientes" valor={r.promotorias_pendientes} color="#F59E0B" onClick={()=>onIrA("promotorias","pendiente")}/>
    <TarjetaKPI label="Clientes gestionados" valor={r.clientes_totales}/>
    <TarjetaKPI label="Pólizas gestionadas" valor={r.polizas_totales} grande/>
    <TarjetaKPI label="Prima total vigente" valor={pesos(r.prima_total_vigente)}/>
  </div>;
}

function Promotorias({initFiltro}){
  const[promotorias,setPromotorias]=useState(null);
  const[error,setError]=useState("");
  const[filtro,setFiltro]=useState(initFiltro||"pendiente");
  const[tasas,setTasas]=useState({});

  const cargar=async()=>{
    const{data,error}=await sb.rpc("admin_promotorias");
    if(error){setError(error.message);return;}
    setPromotorias(data||[]);
  };
  useEffect(()=>{cargar()},[]);

  const guardarTasa=async(p)=>{
    const texto=tasas[p.id];
    const valor=texto!=null&&texto!==""?parseFloat(texto):p.tasa_residual*100;
    if(isNaN(valor)||valor<0||valor>100){setError("La tasa debe ser un número entre 0 y 100.");return;}
    setError("");
    const{error}=await sb.rpc("admin_fijar_tasa_residual",{p_remitente_id:p.id,p_remitente_tipo:"promotoria",p_tasa:valor/100});
    if(error){setError(error.message);return;}
    cargar();
  };

  const aprobar=async(p)=>{
    const{error}=await sb.rpc("admin_aprobar_promotoria",{p_promotoria_id:p.id});
    if(error){setError(error.message);return;}
    cargar();
  };
  const rechazar=async(p)=>{
    if(!window.confirm(`¿Rechazar el registro de ${p.correo}?`))return;
    const{error}=await sb.rpc("admin_rechazar_promotoria",{p_promotoria_id:p.id});
    if(error){setError(error.message);return;}
    cargar();
  };
  const extender=async(p)=>{
    const{error}=await sb.rpc("admin_extender_acceso_promotoria",{p_promotoria_id:p.id,p_dias:30});
    if(error){setError(error.message);return;}
    cargar();
  };

  const resetear2fa=async(p)=>{
    if(!window.confirm(`¿Quitarle la verificación en dos pasos a ${p.nombre_negocio||p.correo}?\n\nVa a poder entrar solo con su contraseña. Dile que la vuelva a activar desde su panel con su teléfono nuevo.`))return;
    const{error}=await sb.rpc("admin_resetear_2fa",{p_user_id:p.id});
    if(error){setError(error.message);return;}
    cargar();
  };

  if(error)return <div style={{color:"#dc2626",fontSize:13}}>{error}</div>;
  if(!promotorias)return <div style={{color:"#6B7280",fontSize:14}}>Cargando...</div>;

  const lista=filtro==="pendiente"?promotorias.filter(p=>p.estatus_aprobacion==="pendiente"):promotorias;

  return <div>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
      <div style={{fontSize:16,fontWeight:700}}>Promotorías {lista?`(${lista.length})`:""}</div>
      <div style={{display:"flex",gap:8}}>
        <button onClick={()=>setFiltro("pendiente")} style={{...est.linkBtn,fontWeight:filtro==="pendiente"?700:500,color:filtro==="pendiente"?"#10284A":"#8FA0B4"}}>Pendientes</button>
        <button onClick={()=>setFiltro("todos")} style={{...est.linkBtn,fontWeight:filtro==="todos"?700:500,color:filtro==="todos"?"#10284A":"#8FA0B4"}}>Todos</button>
      </div>
    </div>

    {lista.length===0&&<div style={{...est.card,textAlign:"center",color:"#6B7280"}}>
      {filtro==="pendiente"?"No hay registros pendientes de aprobación.":"No hay promotorías registradas."}
    </div>}

    {lista.length>0&&<div style={{...est.card,padding:0,overflow:"hidden"}}>
      {lista.map(p=><div key={p.id} style={est.fila}>
        <div>
          <div style={{fontWeight:700,fontSize:14}}>{p.nombre_negocio||p.correo}</div>
          <div style={{fontSize:12,color:"#8FA0B4",marginTop:2}}>
            {p.correo}{p.nombre?` · ${p.nombre}`:""}{p.rfc?` · RFC ${p.rfc}`:""}
          </div>
          <div style={{fontSize:12,color:"#8FA0B4",marginTop:2}}>Código {p.codigo_invitacion} · {p.agentes} agentes en su red</div>
          <div style={{fontSize:12,color:"#8FA0B4",marginTop:2}}>{textoEstatusPago(p)}{p.tiene_2fa?" · 🔒 2FA activado":""}</div>
          <div style={{display:"flex",alignItems:"center",gap:6,marginTop:6}}>
            <span style={{fontSize:11,color:"#8FA0B4"}}>Bono residual:</span>
            <input type="number" min="0" max="100" step="1" placeholder={String(Math.round((p.tasa_residual||0)*100))}
              value={tasas[p.id]??""} onChange={e=>setTasas(prev=>({...prev,[p.id]:e.target.value}))}
              style={{width:50,padding:"3px 6px",fontSize:12,border:"1px solid #DDE4EE",borderRadius:6}}/>
            <span style={{fontSize:11,color:"#8FA0B4"}}>%</span>
            <button onClick={()=>guardarTasa(p)} style={{...est.linkBtn,padding:"2px 6px",fontSize:11}}>Guardar</button>
          </div>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          <span style={est.badge(colorEstatusAgente[p.estatus_aprobacion]||"#6b7280")}>{p.estatus_aprobacion}</span>
          {p.estatus_aprobacion!=="aprobado"&&<button onClick={()=>aprobar(p)} style={{...est.linkBtn,color:"#16a34a"}}>Aprobar</button>}
          {p.estatus_aprobacion!=="rechazado"&&<button onClick={()=>rechazar(p)} style={{...est.linkBtn,color:"#dc2626"}}>Rechazar</button>}
          {p.estatus_aprobacion==="aprobado"&&<button onClick={()=>extender(p)} style={est.linkBtn}>+30 días</button>}
          {p.tiene_2fa&&<button onClick={()=>resetear2fa(p)} style={est.linkBtn}>Perdió su teléfono</button>}
        </div>
      </div>)}
    </div>}
  </div>;
}

function Agencias(){
  const[agencias,setAgencias]=useState(null);
  const[error,setError]=useState("");
  const[filtro,setFiltro]=useState("pendiente");
  const[tasas,setTasas]=useState({});

  const cargar=async()=>{
    const{data,error}=await sb.rpc("admin_agencias_maestras");
    if(error){setError(error.message);return;}
    setAgencias(data||[]);
  };
  useEffect(()=>{cargar()},[]);

  const aprobar=async(a)=>{

  const rechazar=async(a)=>{

  const guardarTasa=async(a)=>{

    setError("");

        <button onClick={()=>setFiltro("todos")} style={{...est.linkBtn,fontWeight:filtro==="todos"?700:500,color:filtro==="todos"?"#10284A":"#8FA0B4"}}>Todas</button>

          <div style={{fontSize:12,color:"#8FA0B4",marginTop:2}}>
            {a.correo}{a.nombre?` · ${a.nombre}`:""}{a.rfc?` · RFC ${a.rfc}`:""}
          </div>
          <div style={{fontSize:12,color:"#8FA0B4",marginTop:2}}>Código {a.codigo_invitacion} · {a.promotorias} promotorías confirmadas</div>
          <div style={{display:"flex",alignItems:"center",gap:6,marginTop:6}}>
            <span style={{fontSize:11,color:"#8FA0B4"}}>Bono residual:</span>

              style={{width:50,padding:"3px 6px",fontSize:12,border:"1px solid #DDE4EE",borderRadius:6}}/>
            <span style={{fontSize:11,color:"#8FA0B4"}}>%</span>
            <button onClick={()=>guardarTasa(a)} style={{...est.linkBtn,padding:"2px 6px",fontSize:11}}>Guardar</button>
          </div>

          <span style={est.badge(colorEstatusAgente[a.estatus_aprobacion]||"#6b7280")}>{a.estatus_aprobacion}</span>
          {a.estatus_aprobacion!=="aprobado"&&<button onClick={()=>aprobar(a)} style={{...est.linkBtn,color:"#16a34a"}}>Aprobar</button>}
          {a.estatus_aprobacion!=="rechazado"&&<button onClick={()=>rechazar(a)} style={{...est.linkBtn,color:"#dc2626"}}>Rechazar</button>}
        </div>

function Agentes({initFiltro}){
  const[agentes,setAgentes]=useState(null);
  const[error,setError]=useState("");
  const[filtro,setFiltro]=useState(initFiltro||"red_pendiente"); // red_pendiente | todos

  const cargar=async()=>{
    const{data,error}=await sb.rpc("admin_agentes");
    if(error){setError(error.message);return;}
    setAgentes(data||[]);
  };
  useEffect(()=>{cargar()},[]);

  const aprobarRed=async(a)=>{
    const{error}=await sb.rpc("admin_aprobar_red",{p_agente_id:a.id});
    if(error){setError(error.message);return;}
    cargar();
  };
  // Ya casi nadie debería quedar "rechazado" — esto es para revertir esa decisión puntual, no
  // para el flujo normal de alta (que ahora se aprueba solo, ver Sesión 17).
  const reactivarCuenta=async(a)=>{
    const{error}=await sb.rpc("admin_aprobar_agente",{p_agente_id:a.id});
    if(error){setError(error.message);return;}
    cargar();
  };
  const rechazar=async(a)=>{
    if(!window.confirm(`¿Rechazar el registro de ${a.correo}?`))return;
    const{error}=await sb.rpc("admin_rechazar_agente",{p_agente_id:a.id});
    if(error){setError(error.message);return;}
    cargar();
  };
  const extender=async(a)=>{

// ============ PROSPECCIÓN (campaña a agencias del directorio de la CNSF) ============
// La secuencia la manda enviar_lote_prospectos() por cron; aquí solo se opera: importar la
// lista, prender/apagar, marcar lo que llega al buzón y editar los textos.
const COLOR_ESTATUS_PROSPECTO={activo:"#1f4a80",respondio:"#16a34a",baja:"#6b7280",rebotado:"#dc2626",queja:"#dc2626",completado:"#8593AA"};
const ETIQUETA_ESTATUS_PROSPECTO={activo:"En secuencia",respondio:"Respondió",baja:"Baja",rebotado:"Rebotó",queja:"Marcó spam",completado:"Secuencia completa"};
const ETIQUETA_RUTA={web:"Upco WEB",insurgest:"InsurGest"};

const ALIAS_PROSPECTO={
  agencia:["agencia","denominacion","denominación","nombre","empresa","razon social"],
  correo:["correo","email","e-mail","correo electronico","correo electrónico"],
  estado:["estado","entidad","entidad federativa"],
  cp:["cp","codigo postal","código postal","c.p."],
  ciudad:["ciudad","ciudad_raw","municipio","poblacion","población"]
};
function mapearColumnasProspecto(encabezados){
  const norm=s=>(s||"").toString().trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  const mapa={};
  for(const campo in ALIAS_PROSPECTO){
    const alias=ALIAS_PROSPECTO[campo].map(norm);
    const hallado=encabezados.find(h=>alias.includes(norm(h)));
    if(hallado)mapa[campo]=hallado;
  }
  return mapa;
}

function ImportarProspectos({onListo}){
  const[filas,setFilas]=useState(null);
  const[error,setError]=useState("");
  const[importando,setImportando]=useState(false);
  const[resultado,setResultado]=useState(null);

  const elegirArchivo=(file)=>{
    setError("");setFilas(null);setResultado(null);
    if(!file)return;
    Papa.parse(file,{
      header:true,skipEmptyLines:true,
      complete:(res)=>{
        if(!res.data.length){setError("El archivo no tiene filas.");return;}
        const m=mapearColumnasProspecto(res.meta.fields||[]);
        if(!m.agencia||!m.correo){
          setError('No encontramos las columnas de "agencia" y "correo" en el archivo. Revisa los encabezados.');
          return;
        }
        setFilas(res.data.map(f=>({
          agencia:(f[m.agencia]||"").trim(),
          correo:(f[m.correo]||"").trim(),
          estado:m.estado?(f[m.estado]||"").trim():null,
          cp:m.cp?(f[m.cp]||"").trim():null,
          ciudad:m.ciudad?(f[m.ciudad]||"").trim():null
        })).filter(f=>f.agencia&&f.correo));
      },
      error:(err)=>setError("No se pudo leer el archivo: "+err.message)
    });
  };

  const importar=async()=>{
    setImportando(true);setError("");
    // Se manda por lotes de 500: un solo RPC con 1,470 filas hace un JSON demasiado grande
    // para la petición, y si truena hay que volver a empezar todo.
    let acum={insertados:0,omitidos:0,invalidos:0};
    for(let i=0;i<filas.length;i+=500){
      const{data,error}=await sb.rpc("admin_importar_prospectos",{p_filas:filas.slice(i,i+500),p_segmento:"agencias_seguros"});
      if(error){setImportando(false);setError(error.message);return;}
      acum={insertados:acum.insertados+data.insertados,omitidos:acum.omitidos+data.omitidos,invalidos:acum.invalidos+data.invalidos};
    }
    setImportando(false);setResultado(acum);setFilas(null);
    onListo&&onListo();
  };

  return <div style={{...est.card,marginBottom:20}}>
    <div style={{fontSize:15,fontWeight:700,marginBottom:4}}>Importar lista</div>
    <div style={{fontSize:13,color:"#6B7280",marginBottom:14}}>
      El CSV necesita al menos las columnas <b>agencia</b> y <b>correo</b>. La ruta se deduce
      sola del dominio del correo. Volver a importar el mismo archivo no duplica ni reinicia a
      nadie que ya vaya a media secuencia.
    </div>
    <input type="file" accept=".csv,text/csv" onChange={e=>elegirArchivo(e.target.files[0])} style={{fontSize:14,marginBottom:12}}/>
    {error&&<div style={{color:"#dc2626",fontSize:13,marginBottom:10}}>{error}</div>}
    {filas&&<div style={{marginBottom:10}}>
      <div style={{fontSize:13,marginBottom:10}}>Se van a importar <b>{filas.length}</b> agencias.</div>
      <Boton onClick={importar} disabled={importando}>{importando?"Importando...":"Confirmar importación"}</Boton>
    </div>}
    {resultado&&<div style={{color:"#16a34a",fontSize:13}}>
      Listo: {resultado.insertados} nuevas, {resultado.omitidos} ya estaban, {resultado.invalidos} sin correo válido.
    </div>}
  </div>;
}

        Días al 3º correo
        <input type="number" min="1" max="30" value={f.dias_a_cierre}
          onChange={e=>setF({...f,dias_a_cierre:e.target.value})}
          onBlur={e=>guardar({dias_a_cierre:e.target.value})} style={{...est.input,marginTop:5,marginBottom:0}}/>
      </label>
    </div>
    <div style={{fontSize:12,color:"#8FA0B4",marginTop:10,lineHeight:1.5}}>
      Remitente: <b>{f.remitente}</b> · las respuestas llegan a <b>{f.responder_a}</b>.
      Durante el calentamiento del dominio: 20 la primera semana, 40 la segunda, 70 la tercera, 100 de ahí en adelante.
    </div>

    <label style={{display:"block",fontSize:12.5,color:"#6B7280",marginTop:14}}>
      Pie legal — se agrega al final de los seis correos
      <textarea value={f.pie_legal||""} onChange={e=>setF({...f,pie_legal:e.target.value})}
        onBlur={e=>guardar({pie_legal:e.target.value})} rows={3}
        style={{...est.input,marginTop:5,marginBottom:0,fontFamily:"ui-monospace,Consolas,monospace",fontSize:12.5,lineHeight:1.55}}/>
    </label>
    <div style={{fontSize:11.5,color:"#8FA0B4",marginTop:6,lineHeight:1.5}}>
      Enlaza al aviso de privacidad en vez de repetir tu nombre y domicilio en cada correo. Los datos completos
      del responsable siguen ahí, a un clic — y un enlace al aviso cumple mejor que una línea con la dirección,
      porque es la forma en que la ley contempla ponerlo a disposición.
    </div>
    {error&&<div style={{color:"#dc2626",fontSize:13,marginTop:10}}>{error}</div>}
    {msg&&<div style={{color:"#16a34a",fontSize:13,marginTop:10}}>{msg}</div>}
  </div>;
}

function PlantillasProspeccion(){
  const[filas,setFilas]=useState(null);
  const[error,setError]=useState("");
  const[msg,setMsg]=useState("");

  const cargar=async()=>{
    const{data,error}=await sb.rpc("admin_plantillas_prospeccion",{p_segmento:"agencias_seguros"});
    if(error){setError(error.message);return;}
    setFilas(data||[]);
  };
  useEffect(()=>{cargar()},[]);

  const guardar=async(p)=>{
    setError("");setMsg("");
    const{error}=await sb.rpc("admin_guardar_plantilla",{p_ruta:p.ruta,p_etapa:p.etapa,p_asunto:p.asunto,p_cuerpo_html:p.cuerpo_html,p_segmento:"agencias_seguros"});
    if(error){setError(error.message);return;}
    setMsg("Plantilla guardada.");setTimeout(()=>setMsg(""),2500);
  };

  if(!filas)return <div style={{color:"#6B7280",fontSize:14}}>Cargando...</div>;
  return <div>
    <div style={{fontSize:13,color:"#6B7280",marginBottom:16,lineHeight:1.55}}>
      Se escribe en HTML simple: <code>&lt;p&gt;</code> para cada párrafo y <code>&lt;a href="..."&gt;</code> para las ligas.
      Donde escribas <code>{"{AGENCIA}"}</code> se sustituye el nombre real. El pie legal se agrega solo al final de los seis,
      no hay que ponerlo aquí. Deliberadamente sin botones ni imágenes: un correo frío muy maquetado se clasifica como
      promoción y baja la entrega.
    </div>
    {error&&<div style={{color:"#dc2626",fontSize:13,marginBottom:10}}>{error}</div>}
    {msg&&<div style={{color:"#16a34a",fontSize:13,marginBottom:10}}>{msg}</div>}
    {filas.map((p,i)=><div key={p.ruta+p.etapa} style={{...est.card,marginBottom:14}}>
      <div style={{fontSize:12,fontWeight:700,color:"#8FA0B4",textTransform:"uppercase",letterSpacing:".07em",marginBottom:8}}>
        {ETIQUETA_RUTA[p.ruta]} · correo {p.etapa} de 3
      </div>
      <input value={p.asunto} onChange={e=>{const c=[...filas];c[i]={...p,asunto:e.target.value};setFilas(c);}} style={est.input}/>
      <textarea value={p.cuerpo_html} onChange={e=>{const c=[...filas];c[i]={...p,cuerpo_html:e.target.value};setFilas(c);}}
        rows={10} style={{...est.input,fontFamily:"ui-monospace,Consolas,monospace",fontSize:13,lineHeight:1.55}}/>
      <Boton onClick={()=>guardar(filas[i])}>Guardar este correo</Boton>
    </div>)}
  </div>;
}

function Prospectos(){
  const[resumen,setResumen]=useState(null);
  const[lista,setLista]=useState(null);
  // El filtro tiene dos partes: e = estatus, v = vista (combinaciones de estatus y etapa)
  const[filtro,setFiltro]=useState({e:"",v:""});
  const[busqueda,setBusqueda]=useState("");
  const[subvista,setSubvista]=useState("panel");
  const[error,setError]=useState("");
  const[disparando,setDisparando]=useState(false);
  const[avisoLote,setAvisoLote]=useState("");
  const refLista=useRef(null);

  const cargar=async()=>{
    // p_segmento explícito desde la Sesión 51: la máquina ahora sirve varios públicos
    // (agencias de seguros aquí, escuelas desde el admin de Upco Web) y cada función pide
    // el segmento para no mezclar campañas.
    const args={p_estatus:filtro.e||null,p_ruta:null,p_busqueda:busqueda||null,p_limite:300,p_segmento:"agencias_seguros"};
    // p_vista solo se manda cuando hace falta: así el panel sigue funcionando
    // aunque todavía no se haya corrido la migración de la sesión 48.
    if(filtro.v) args.p_vista=filtro.v;
    const[r1,r2]=await Promise.all([
      sb.rpc("admin_prospeccion_resumen",{p_segmento:"agencias_seguros"}),
      sb.rpc("admin_prospectos",args)
    ]);
    if(r1.error){setError(r1.error.message);return;}
    if(r2.error){
      const m=r2.error.message||"";
      setError(/p_vista|does not exist|schema cache/i.test(m)
        ? "Falta correr la migración de la sesión 48 en Supabase para que las tarjetas filtren. Mientras tanto usa las pestañas de abajo."
        : m);
      return;
    }
    setError("");setResumen(r1.data);setLista(r2.data||[]);
  };
  useEffect(()=>{cargar()},[filtro.e,filtro.v,busqueda]);

  /** Aplica un filtro desde una tarjeta y baja la vista hasta la lista. */
  const verFiltro=(e,v)=>{
    const igual=filtro.e===(e||"")&&filtro.v===(v||"");
    setFiltro(igual?{e:"",v:""}:{e:e||"",v:v||""});
    setTimeout(()=>{if(refLista.current)refLista.current.scrollIntoView({behavior:"smooth",block:"start"})},120);
  };
  const activa=(e,v)=>filtro.e===(e||"")&&filtro.v===(v||"");

  const marcar=async(id,estatus)=>{
    const{error}=await sb.rpc("admin_marcar_prospecto",{p_id:id,p_estatus:estatus,p_notas:null});
    if(error){setError(error.message);return;}
    cargar();
  };

  const dispararAhora=async()=>{
    setDisparando(true);setAvisoLote("");
    const{data,error}=await sb.rpc("admin_disparar_lote");
    setDisparando(false);
    if(error){setError(error.message);return;}
    setAvisoLote(data.motivo?`No se mandó nada: ${data.motivo}.`:`Se mandaron ${data.enviados} correos.`);
    cargar();
  };

  if(error)return <div style={{color:"#dc2626",fontSize:14}}>{error}</div>;
  if(!resumen)return <div style={{color:"#6B7280",fontSize:14}}>Cargando...</div>;

  const enviados=resumen.correos_enviados||0;
  const pct=(n)=>enviados?Math.round((n/enviados)*100)+"%":"—";

  return <div>
    <div style={{display:"flex",gap:16,marginBottom:20,borderBottom:"1px solid #DDE4EE"}}>
      <button onClick={()=>setSubvista("panel")} style={tabStyle(subvista==="panel")}>Campaña</button>
      <button onClick={()=>setSubvista("plantillas")} style={tabStyle(subvista==="plantillas")}>Los 6 correos</button>
    </div>

    {subvista==="plantillas"?<PlantillasProspeccion/>:<div>
      <div style={{display:"flex",gap:10,flexWrap:"wrap",marginBottom:20}}>
        <TarjetaCifra valor={resumen.total} etiqueta="Agencias en la lista"
          onClick={()=>verFiltro("","")} activa={activa("","")}/>
        <TarjetaCifra valor={resumen.sin_contactar} etiqueta="Sin contactar"
          onClick={()=>verFiltro("","sin_contactar")} activa={activa("","sin_contactar")}/>
        <TarjetaCifra valor={resumen.en_secuencia} etiqueta="A media secuencia" color="#1f4a80"
          onClick={()=>verFiltro("","en_secuencia")} activa={activa("","en_secuencia")}/>
        <TarjetaCifra valor={resumen.respondieron} etiqueta="Respondieron" color="#16a34a"
          onClick={()=>verFiltro("respondio","")} activa={activa("respondio","")}/>
      </div>
      <div style={{display:"flex",gap:10,flexWrap:"wrap",marginBottom:20}}>
        <TarjetaCifra valor={enviados} etiqueta={`Correos enviados · ${resumen.enviados_hoy} hoy`}
          onClick={()=>verFiltro("","contactados")} activa={activa("","contactados")}/>
        {/* Aperturas y clics son eventos, no estatus: no hay lista que filtrar todavía. */}
        <TarjetaCifra valor={pct(resumen.abrieron)} etiqueta={`Abrieron (${resumen.abrieron} agencias)`} color="#1f4a80"/>
        <TarjetaCifra valor={pct(resumen.clicaron)} etiqueta={`Hicieron clic (${resumen.clicaron} agencias)`} color="#F59E0B"/>
        <TarjetaCifra valor={resumen.rebotados+resumen.quejas} etiqueta={`Rebotes y quejas de spam`}
          color={(resumen.rebotados+resumen.quejas)>0?"#dc2626":"#8593AA"}
          onClick={()=>verFiltro("","problema")} activa={activa("","problema")}/>
      </div>

      {enviados>=300&&resumen.respondieron<3&&<div style={{background:"#FDF2DC",border:"1px solid #E8B04B",borderLeft:"4px solid #E8B04B",borderRadius:10,padding:"14px 18px",marginBottom:20,fontSize:13.5,color:"#6B3D07",lineHeight:1.55}}>
        Van {enviados} correos y solo {resumen.respondieron} respuestas. Antes de seguir gastando lista,
        conviene cambiar el primer párrafo o el asunto en "Los 6 correos".
      </div>}

      <AjustesProspeccion ajustes={resumen.ajustes} onGuardado={cargar}/>
      <ImportarProspectos onListo={cargar}/>

      <div style={{...est.card,marginBottom:20,display:"flex",justifyContent:"space-between",alignItems:"center",gap:12,flexWrap:"wrap"}}>
        <div style={{fontSize:13,color:"#6B7280",flex:"1 1 220px"}}>
          Manda el lote de esta hora sin esperar al reloj. Respeta el tope del día.
        </div>
        <Boton color="#53647D" onClick={dispararAhora} disabled={disparando}>{disparando?"Mandando...":"Mandar lote ahora"}</Boton>
      </div>
      {avisoLote&&<div style={{fontSize:13,color:"#1f4a80",marginBottom:16}}>{avisoLote}</div>}

      <div ref={refLista} style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:12}}>
        {[["","Todos"],["activo","En secuencia"],["respondio","Respondieron"],["completado","Completos"],
          ["baja","Bajas"],["rebotado","Rebotes"],["queja","Marcaron spam"]]
          .map(([v,t])=><button key={v} onClick={()=>setFiltro({e:v,v:""})}
            style={{...est.linkBtn,fontWeight:activa(v,"")?700:400,color:activa(v,"")?"#10284A":"#53647D"}}>{t}</button>)}
      </div>
      <input placeholder="Buscar por agencia, correo o estado" value={busqueda}
        onChange={e=>setBusqueda(e.target.value)} style={est.input}/>

      {lista&&lista.length===0&&<div style={{...est.card,textAlign:"center",color:"#6B7280"}}>
        No hay agencias con ese filtro. Importa el CSV para empezar.
      </div>}
      {lista&&lista.length>0&&<div style={{...est.card,padding:0,overflow:"hidden"}}>
        {lista.map(p=><div key={p.id} style={{...est.fila,alignItems:"flex-start",flexWrap:"wrap",gap:10}}>
          <div style={{flex:"1 1 240px",minWidth:0}}>
            <div style={{fontWeight:700,fontSize:14,wordBreak:"break-word"}}>{p.agencia}</div>
            <div style={{fontSize:12,color:"#8FA0B4",marginTop:2,wordBreak:"break-all"}}>{p.correo}</div>
            <div style={{marginTop:6,display:"flex",gap:6,flexWrap:"wrap",alignItems:"center"}}>
              <span style={est.badge(COLOR_ESTATUS_PROSPECTO[p.estatus]||"#8593AA")}>{ETIQUETA_ESTATUS_PROSPECTO[p.estatus]||p.estatus}</span>
              <span style={{fontSize:11.5,color:"#8FA0B4"}}>{ETIQUETA_RUTA[p.ruta]} · correo {p.etapa} de 3{p.estado?` · ${p.estado}`:""}</span>
              {p.aperturas>0&&<span style={{fontSize:11.5,color:"#1f4a80",fontWeight:600}}>abrió</span>}
              {p.clics>0&&<span style={{fontSize:11.5,color:"#B45309",fontWeight:600}}>hizo clic</span>}
            </div>
          </div>
          {(p.estatus==="activo"||p.estatus==="completado")&&<div style={{display:"flex",gap:4,flexShrink:0}}>
            <button onClick={()=>marcar(p.id,"respondio")} style={{...est.linkBtn,color:"#16a34a",fontWeight:600}}>Respondió</button>
            <button onClick={()=>marcar(p.id,"baja")} style={{...est.linkBtn,color:"#dc2626"}}>Baja</button>
          </div>}
        </div>)}
      </div>}
      {lista&&lista.length>=300&&<div style={{fontSize:12,color:"#8FA0B4",marginTop:10}}>
        Se muestran las primeras 300. Usa el buscador o los filtros para acotar.
      </div>}
    </div>}
  </div>;
}

function PanelAdmin({session,onSalir}){
  const[vista,setVista]=useState("resumen"); // resumen | agentes | promotorias | servicios
  const[filtroAgentes,setFiltroAgentes]=useState("red_pendiente");
  const[filtroPromotorias,setFiltroPromotorias]=useState("pendiente");
  const[noAutorizado,setNoAutorizado]=useState(false);

  // Único punto de navegación entre pestañas: lo usan tanto los botones de arriba como las
  // tarjetas de Resumen, para que un clic en un número deje la lista filtrada tal cual promete.
  const irA=(v,f)=>{
    if(v==="agentes")setFiltroAgentes(f||"red_pendiente");
    if(v==="promotorias")setFiltroPromotorias(f||"pendiente");
    setVista(v);
  };

  useEffect(()=>{
    sb.rpc("es_admin").then(({data,error})=>{
      if(error||!data)setNoAutorizado(true);
    });
  },[]);

  if(noAutorizado)return <div style={{padding:40,textAlign:"center",color:"#dc2626"}}>
    Esta cuenta no tiene permiso para ver el panel de administración.
    <div style={{marginTop:16}}><button onClick={onSalir} style={est.linkBtn}>Salir</button></div>
  </div>;

  return <div style={{maxWidth:760,margin:"0 auto",padding:"24px 16px 60px"}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
      <div style={{fontSize:16,fontWeight:700,color:"#10284A"}}>Hola, fundador</div>
      <button onClick={onSalir} style={{background:"none",border:"none",color:"#6B7280",fontSize:14,cursor:"pointer"}}>Salir ({session.user.email})</button>
    </div>

    <div style={{display:"flex",gap:16,marginBottom:24,borderBottom:"1px solid #DDE4EE"}}>
      <button onClick={()=>irA("resumen")} style={tabStyle(vista==="resumen")}>Resumen</button>
      <button onClick={()=>irA("agentes")} style={tabStyle(vista==="agentes")}>Agentes</button>
      <button onClick={()=>irA("promotorias")} style={tabStyle(vista==="promotorias")}>Promotorías</button>
      <button onClick={()=>irA("agencias")} style={tabStyle(vista==="agencias")}>Agencias</button>
      <button onClick={()=>irA("comisiones")} style={tabStyle(vista==="comisiones")}>Comisiones</button>
      <button onClick={()=>irA("servicios")} style={tabStyle(vista==="servicios")}>Servicios</button>
      <button onClick={()=>irA("invitar")} style={tabStyle(vista==="invitar")}>Invitar</button>
      <button onClick={()=>irA("prospectos")} style={tabStyle(vista==="prospectos")}>Prospectos</button>
    </div>

    {vista==="resumen"?<Resumen onIrA={irA}/>:vista==="promotorias"?<Promotorias initFiltro={filtroPromotorias}/>:vista==="agencias"?<Agencias/>:vista==="comisiones"?<Comisiones/>:vista==="servicios"?<SolicitudesServicio/>:vista==="invitar"?<Invitar/>:vista==="prospectos"?<Prospectos/>:<Agentes initFiltro={filtroAgentes}/>}
  </div>;
}

function App(){
  const[sesion,setSesion]=useState(undefined);
  useEffect(()=>{
    sb.auth.getSession().then(({data})=>setSesion(data.session||null));
    const{data:sub}=sb.auth.onAuthStateChange((_e,s)=>setSesion(s));
    return ()=>sub.subscription.unsubscribe();
  },[]);
  return <>
    <HeaderBar/>
    {sesion===undefined
      ?<div style={{padding:40,textAlign:"center",color:"#6B7280"}}>Cargando...</div>
      :!sesion
        ?<Login/>
        :<PanelAdmin session={sesion} onSalir={()=>sb.auth.signOut()}/>}
  </>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
