function PolizaForm({clienteId,clientesDisponibles,promotoriaId,polizaExistente,onGuardado,onCancelar}){
  const p=polizaExistente;
  const ramoInicial=p&&!RAMOS_SUGERIDOS.includes(p.ramo)?"Otro":(p?p.ramo:"Auto");
  const[clienteSel,setClienteSel]=useState(clienteId||(p?p.cliente_id:"")||"");
  const[ramo,setRamo]=useState(ramoInicial);
  const[ramoOtro,setRamoOtro]=useState(ramoInicial==="Otro"?p.ramo:"");
  const[aseguradora,setAseguradora]=useState(p?p.aseguradora||"":"");
  const[numeroPoliza,setNumeroPoliza]=useState(p?p.numero_poliza||"":"");
  const[vehiculoId,setVehiculoId]=useState(p?p.vehiculo_id||"":"");
  const[vehiculos,setVehiculos]=useState(null);
  const[duracion,setDuracion]=useState(p?"custom":"1");

  useEffect(()=>{
    if(!clienteSel){setVehiculos([]);return;}
    sb.from("vehiculos").select("id,placas,marca,modelo,tipo_vehiculo").eq("cliente_id",clienteSel).order("created_at")
      .then(({data})=>setVehiculos(data||[]));
  },[clienteSel]);
  const[fechaInicio,setFechaInicio]=useState(p?p.fecha_inicio||"":"");
  const[fechaFin,setFechaFin]=useState(p?p.fecha_fin||"":"");

  useEffect(()=>{
    if(duracion==="custom"||!fechaInicio)return;
    setFechaFin(sumarAnios(fechaInicio,parseInt(duracion,10)));
  },[duracion,fechaInicio]);
  const[primaNeta,setPrimaNeta]=useState(p&&p.prima_neta!=null?String(p.prima_neta):"");
  const[derechos,setDerechos]=useState(p&&p.derechos!=null?String(p.derechos):"");
  const[iva,setIva]=useState(p&&p.iva!=null?String(p.iva):"");
  const[prima,setPrima]=useState(p&&p.prima!=null?String(p.prima):"");
  // Una vez que se teclea el gran total a mano, se deja de recalcular solo: puede haber
  // recargo por pago fraccionado u otros conceptos que no capturamos por separado.
  const[totalManual,setTotalManual]=useState(!!(p&&p.prima!=null));
  const[llevaComision,setLlevaComision]=useState(!!(p&&p.comision_pct!=null));
  const[comisionPct,setComisionPct]=useState(p&&p.comision_pct!=null?String(p.comision_pct):"");

  useEffect(()=>{
    if(totalManual)return;
    const suma=(parseFloat(primaNeta)||0)+(parseFloat(derechos)||0)+(parseFloat(iva)||0);
    setPrima(suma>0?String(Number(suma.toFixed(2))):"");
  },[primaNeta,derechos,iva,totalManual]);

  // Comisión sugerida sólo para Auto, donde el porcentaje es razonablemente estable:
  // 8% en carga (incluye flotillas), 10% en auto y moto. En Vida y otros ramos el rango es
  // demasiado amplio para sugerir un número. Siempre editable.
  const comisionSugerida=()=>{
    if(ramo!=="Auto")return "";
    const v=(vehiculos||[]).find(x=>x.id===vehiculoId);
    return v&&v.tipo_vehiculo==="carga"?"8":"10";
  };
  const alternarComision=(activo)=>{
    setLlevaComision(activo);
    if(activo&&!comisionPct)setComisionPct(comisionSugerida());
    if(!activo)setComisionPct("");
  };
  const[formaPago,setFormaPago]=useState(p?p.forma_pago||"anual":"anual");
  const[estatus,setEstatus]=useState(p?p.estatus:"vigente");
  const[notas,setNotas]=useState(p?p.notas||"":"");
  const[archivo,setArchivo]=useState(null);
  const[guardando,setGuardando]=useState(false);
  const[error,setError]=useState("");

  const guardar=async(e)=>{
    e.preventDefault();
    if(!clienteSel){setError("Selecciona a qué cliente pertenece esta póliza.");return;}
    const ramoFinal=ramo==="Otro"?(ramoOtro.trim()||"Otro"):ramo;
    setError("");setGuardando(true);
    const payload={
      aseguradora:aseguradora.trim()||null,
      numero_poliza:numeroPoliza.trim()||null,
      vehiculo_id:ramo==="Auto"?(vehiculoId||null):null,
      ramo:ramoFinal,
      fecha_inicio:fechaInicio||null,
      fecha_fin:fechaFin||null,
      prima_neta:primaNeta?parseFloat(primaNeta):null,
      derechos:derechos?parseFloat(derechos):null,
      iva:iva?parseFloat(iva):null,
      prima:prima?parseFloat(prima):null,
      // Nulo cuando se apaga el control de comisión: la póliza no cuenta en los totales
      // en vez de contar como cero, que falsearía el reporte hacia abajo.
      comision_pct:llevaComision&&comisionPct?parseFloat(comisionPct):null,
      forma_pago:formaPago||null,
      estatus,
      notas:notas.trim()||null,
    };
    let resultado;
    if(p){
      resultado=await sb.from("polizas").update(payload).eq("id",p.id).select().single();
    }else{
      resultado=await sb.from("polizas").insert({...payload,cliente_id:clienteSel}).select().single();
    }
    if(resultado.error){setGuardando(false);setError(resultado.error.message);return;}
    let polizaFinal=resultado.data;

    if(archivo){
      const{data:usoActual}=await sb.rpc("mi_uso_almacenamiento");
      if((usoActual||0)+archivo.size>LIMITE_STORAGE_BYTES){
        setGuardando(false);
        setError(`La póliza se guardó, pero el PDF no cabe: ya usas ${formatBytes(usoActual||0)} de tu límite de 5 GB. Elimina PDFs viejos o contáctanos para más espacio.`);
        return;
      }
      const ruta=`${promotoriaId}/${polizaFinal.id}.pdf`;
      const{error:errSubida}=await sb.storage.from("polizas").upload(ruta,archivo,{upsert:true,contentType:"application/pdf"});
      if(errSubida){setGuardando(false);setError("La póliza se guardó pero el PDF no se pudo subir: "+errSubida.message);return;}
      const{data:firmado,error:errFirma}=await sb.storage.from("polizas").createSignedUrl(ruta,UN_ANIO_SEGUNDOS);
      if(errFirma){setGuardando(false);setError("El PDF se subió pero no se pudo generar el link: "+errFirma.message);return;}
      const{data:conPdf,error:errUpd}=await sb.from("polizas").update({pdf_path:ruta,pdf_url:firmado.signedUrl}).eq("id",polizaFinal.id).select().single();
      if(!errUpd)polizaFinal=conPdf;
    }
    setGuardando(false);
    onGuardado(polizaFinal);
  };

  return <form onSubmit={guardar} style={{...est.card,marginBottom:24}}>
    <div style={{fontSize:16,fontWeight:700,marginBottom:16}}>{p?"Editar póliza":"Nueva póliza"}</div>

    {!clienteId&&<Campo label="Cliente">
      <select name="cliente_id" value={clienteSel} onChange={e=>setClienteSel(e.target.value)} style={est.input}>
        <option value="">— Selecciona un cliente —</option>
        {(clientesDisponibles||[]).map(c=><option key={c.id} value={c.id}>{c.nombre}</option>)}
      </select>
    </Campo>}

    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
      <Campo label="Ramo">
        <select name="ramo" value={ramo} onChange={e=>setRamo(e.target.value)} style={est.input}>
          {RAMOS_SUGERIDOS.map(r=><option key={r} value={r}>{r}</option>)}
          <option value="Otro">Otro</option>
        </select>
      </Campo>
      {ramo==="Otro"&&<Campo label="¿Cuál ramo?">
        <input name="ramo_otro" value={ramoOtro} onChange={e=>setRamoOtro(e.target.value)} style={est.input}/>
      </Campo>}
    </div>

    {ramo==="Auto"&&clienteSel&&<Campo label="Vehículo asociado">
      <select name="vehiculo_id" value={vehiculoId} onChange={e=>setVehiculoId(e.target.value)} style={est.input}>
        <option value="">Sin vehículo asociado</option>
        {(vehiculos||[]).map(veh=><option key={veh.id} value={veh.id}>{veh.placas||"Sin placas"} — {veh.marca||""} {veh.modelo||""}</option>)}
      </select>
      {vehiculos&&vehiculos.length===0&&<div style={{fontSize:12,color:"#8FA0B4",marginTop:-6,marginBottom:10}}>Este cliente todavía no tiene vehículos registrados.</div>}
    </Campo>}

    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
      <Campo label="Aseguradora">
        <input name="aseguradora" value={aseguradora} onChange={e=>setAseguradora(e.target.value)} style={est.input}/>
      </Campo>
      <Campo label="Número de póliza">
        <input name="numero_poliza" value={numeroPoliza} onChange={e=>setNumeroPoliza(e.target.value)} style={est.input}/>
      </Campo>
    </div>

    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
      <Campo label="Inicio de vigencia">
        <input name="fecha_inicio" value={fechaInicio} onChange={e=>setFechaInicio(e.target.value)} type="date" style={est.input}/>
      </Campo>
      <Campo label="Duración">
        <select name="duracion" value={duracion} onChange={e=>setDuracion(e.target.value)} style={est.input}>
          {DURACIONES.map(d=><option key={d.value} value={d.value}>{d.label}</option>)}
        </select>
      </Campo>
    </div>

    <Campo label={duracion==="custom"?"Fin de vigencia":`Fin de vigencia (calculado: ${duracion==="1"?"1 año":"2 años"} desde el inicio)`}>
      <input name="fecha_fin" value={fechaFin} onChange={e=>setFechaFin(e.target.value)} type="date" readOnly={duracion!=="custom"}
        style={{...est.input,background:duracion!=="custom"?"#F4F7FB":"#fff"}}/>
    </Campo>

    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
      <Campo label="Prima neta (MXN)">
        <input name="prima_neta" value={primaNeta} onChange={e=>setPrimaNeta(e.target.value)} type="number" step="0.01" min="0" style={est.input}/>
      </Campo>
      <Campo label="Derechos de póliza">
        <input name="derechos" value={derechos} onChange={e=>setDerechos(e.target.value)} type="number" step="0.01" min="0" style={est.input}/>
      </Campo>
    </div>

    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
      <Campo label="IVA">
        <input name="iva" value={iva} onChange={e=>setIva(e.target.value)} type="number" step="0.01" min="0" style={est.input}/>
      </Campo>
      <Campo label="Prima total (lo que paga el cliente)">
        <input name="prima" value={prima} onChange={e=>{setTotalManual(true);setPrima(e.target.value);}}
          type="number" step="0.01" min="0" style={est.input}/>
      </Campo>
    </div>
    <div style={{fontSize:11.5,color:"#8FA0B4",marginTop:-6,marginBottom:12}}>
      El total se suma solo; puedes editarlo si la póliza trae recargo por pago fraccionado u otro concepto.
    </div>

    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
      <Campo label="Forma de pago">
        <select name="forma_pago" value={formaPago} onChange={e=>setFormaPago(e.target.value)} style={est.input}>
          {FORMAS_PAGO.map(f=><option key={f} value={f}>{f}</option>)}
        </select>
      </Campo>
      <Campo label="Comisión">
        <label style={{display:"flex",alignItems:"center",gap:8,fontSize:13.5,color:"#374151",padding:"11px 0"}}>
          <input name="lleva_comision" type="checkbox" checked={llevaComision}
            onChange={e=>alternarComision(e.target.checked)} style={{width:16,height:16}}/>
          Llevar control de comisión
        </label>
      </Campo>
    </div>

    {llevaComision&&<div style={{background:"#F4F7FB",borderRadius:10,padding:"14px 16px",marginBottom:12}}>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,alignItems:"end"}}>
        <Campo label="% de comisión">
          <input name="comision_pct" value={comisionPct} onChange={e=>setComisionPct(e.target.value)}
            type="number" step="0.01" min="0" max="100" placeholder={comisionSugerida()||"Ej. 25"} style={est.input}/>
        </Campo>
        <div style={{paddingBottom:10}}>
          <div style={{fontSize:11.5,color:"#8FA0B4"}}>Comisión estimada</div>
          <div style={{fontSize:19,fontWeight:700,color:"#10284A"}}>
            {primaNeta&&comisionPct
              ? pesos((parseFloat(primaNeta)||0)*(parseFloat(comisionPct)||0)/100)
              : "—"}
          </div>
        </div>
      </div>
      <div style={{fontSize:11.5,color:"#8FA0B4",marginTop:8}}>
        Se calcula sobre la prima neta, que es como la pagan las aseguradoras — nunca sobre el IVA ni los derechos.
        {ramo==="Auto"&&" Para Auto se sugiere 10% (8% en carga), pero puedes cambiarlo."}
      </div>
    </div>}

    <Campo label="Estatus">
      <select name="estatus" value={estatus} onChange={e=>setEstatus(e.target.value)} style={est.input}>
        {ESTATUS_POLIZA.map(s=><option key={s} value={s}>{s}</option>)}
      </select>
    </Campo>

    <Campo label={p&&p.pdf_url?"Reemplazar PDF de la póliza":"PDF de la póliza"}>
      <input name="pdf" type="file" accept="application/pdf" onChange={e=>setArchivo(e.target.files[0]||null)} style={{...est.input,padding:"8px 10px"}}/>
    </Campo>

    <Campo label="Notas">
      <textarea name="notas" value={notas} onChange={e=>setNotas(e.target.value)} rows={2} style={est.input}/>
    </Campo>

    {error&&<div style={{color:"#dc2626",fontSize:13,marginBottom:10}}>{error}</div>}
    <div style={{display:"flex",gap:10}}>
      <Boton type="submit" disabled={guardando}>{guardando?"Guardando...":"Guardar"}</Boton>
      <button type="button" onClick={onCancelar} style={est.linkBtn}>Cancelar</button>
    </div>
  </form>;
}

function PolizasList({clienteId,promotoriaId,onPolizaCambiada}){
  const[polizas,setPolizas]=useState(null);
  const[vehiculosPorId,setVehiculosPorId]=useState({});
  const[formAbierto,setFormAbierto]=useState(false);
  const[editando,setEditando]=useState(null);
  const[error,setError]=useState("");

  const cargar=async()=>{
    const{data,error}=await sb.from("polizas").select("*").eq("cliente_id",clienteId).order("fecha_fin",{ascending:false});
    if(error){setError(error.message);return;}
    setPolizas(data);
    const{data:vehiculos}=await sb.from("vehiculos").select("id,placas,marca,modelo").eq("cliente_id",clienteId);
    const mapa={};
    (vehiculos||[]).forEach(v=>mapa[v.id]=v);
    setVehiculosPorId(mapa);
  };
  useEffect(()=>{cargar()},[]);

  const eliminar=async(poliza)=>{
    if(!window.confirm(`¿Eliminar la póliza ${poliza.numero_poliza||""}?`.trim()))return;
    if(poliza.pdf_path)await sb.storage.from("polizas").remove([poliza.pdf_path]);
    const{error}=await sb.from("polizas").delete().eq("id",poliza.id);
    if(error){setError(error.message);return;}
    cargar();
    if(onPolizaCambiada)onPolizaCambiada();
  };

  const descargar=(poliza)=>{
    window.open(poliza.pdf_url,"_blank");
  };

  return <div>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
      <div style={{fontSize:16,fontWeight:700}}>Pólizas {polizas?`(${polizas.length})`:""}</div>
      {!formAbierto&&!editando&&<Boton color="#F59E0B" onClick={()=>setFormAbierto(true)}>+ Nueva póliza</Boton>}
    </div>

    {formAbierto&&<PolizaForm clienteId={clienteId} promotoriaId={promotoriaId}
      onGuardado={()=>{setFormAbierto(false);cargar();if(onPolizaCambiada)onPolizaCambiada();}}
      onCancelar={()=>setFormAbierto(false)}/>}

    {editando&&<PolizaForm clienteId={clienteId} promotoriaId={promotoriaId} polizaExistente={editando}
      onGuardado={()=>{setEditando(null);cargar();if(onPolizaCambiada)onPolizaCambiada();}}
      onCancelar={()=>setEditando(null)}/>}

    {error&&<div style={{color:"#dc2626",fontSize:13,marginBottom:10}}>{error}</div>}
    {!polizas&&<div style={{color:"#6B7280",fontSize:14}}>Cargando...</div>}
    {polizas&&polizas.length===0&&!formAbierto&&<div style={{...est.card,textAlign:"center",color:"#6B7280"}}>
      Este cliente todavía no tiene pólizas registradas.
    </div>}
    {polizas&&polizas.map(p=>{
      const vig=vigenciaCalculada(p);
      const veh=p.vehiculo_id?vehiculosPorId[p.vehiculo_id]:null;
      return <div key={p.id} style={{...est.card,marginBottom:10}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
        <div>
          <div style={{fontWeight:700,fontSize:14}}>{p.ramo} — {p.aseguradora||"Sin aseguradora"}</div>
          <div style={{fontSize:12,color:"#8FA0B4",marginTop:2}}>Póliza {p.numero_poliza||"—"} · {fecha(p.fecha_inicio)} a {fecha(p.fecha_fin)}</div>
          {veh&&<div style={{fontSize:12,color:"#8FA0B4",marginTop:2}}>Vehículo: {veh.placas||"Sin placas"}{veh.marca?` — ${veh.marca} ${veh.modelo||""}`:""}</div>}
          {vig.dias!=null&&<div style={{fontSize:12,color:vig.dias<0?"#dc2626":vig.dias<=15?"#F59E0B":"#8FA0B4",marginTop:2,fontWeight:600}}>{textoDias(vig.dias)}</div>}
        </div>
        <span style={est.badge(colorEstatus[vig.label]||"#6b7280")}>{vig.label}</span>
      </div>
      <div style={{marginTop:10,fontSize:13,color:"#374151",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <span>
          {pesos(p.prima)} {p.forma_pago?`· ${p.forma_pago}`:""}
          {p.comision_monto!=null&&<span style={{color:"#16a34a",fontWeight:600}}>{" · "}{pesos(p.comision_monto)} de comisión</span>}
        </span>
        <div style={{display:"flex",gap:4}}>
          {p.pdf_url&&<button onClick={()=>descargar(p)} style={est.linkBtn}>Descargar PDF</button>}
          <button onClick={()=>setEditando(p)} style={est.linkBtn}>Editar</button>
          <button onClick={()=>eliminar(p)} style={{...est.linkBtn,color:"#dc2626"}}>Eliminar</button>
        </div>
      </div>
    </div>;
    })}
  </div>;
}

// ============ SINIESTROS Y RECLAMACIONES (mismos componentes que /app) ============
const TIPOS_SINIESTRO=[
  {value:"gmm",label:"Siniestro de Gastos Médicos Mayores"},
  {value:"reembolso",label:"Reclamación de reembolso"},
  {value:"cirugia",label:"Programación de cirugía"},
  {value:"otro",label:"Otro"}
];
const ESTATUS_SINIESTRO=[
  {value:"abierto",label:"Abierto",color:"#F59E0B"},
  {value:"en_revision",label:"En revisión",color:"#2563eb"},
  {value:"resuelto",label:"Resuelto",color:"#16a34a"},
  {value:"rechazado",label:"Rechazado",color:"#dc2626"}
];
const etiquetaTipoSiniestro=(s)=>s.tipo==="otro"?(s.tipo_otro||"Otro"):(TIPOS_SINIESTRO.find(t=>t.value===s.tipo)||{}).label||s.tipo;
const estatusSiniestroInfo=(v)=>ESTATUS_SINIESTRO.find(e=>e.value===v)||ESTATUS_SINIESTRO[0];

function SiniestroForm({clienteId,siniestroExistente,onGuardado,onCancelar}){
  const s=siniestroExistente;
  const[tipo,setTipo]=useState(s?s.tipo:"gmm");
  const[tipoOtro,setTipoOtro]=useState(s?s.tipo_otro||"":"");
  const[descripcion,setDescripcion]=useState(s?s.descripcion||"":"");
  const[montoReclamado,setMontoReclamado]=useState(s&&s.monto_reclamado!=null?String(s.monto_reclamado):"");
  const[fechaEvento,setFechaEvento]=useState(s?s.fecha_evento||"":"");
  const[estatus,setEstatus]=useState(s?s.estatus:"abierto");
  const[guardando,setGuardando]=useState(false);
  const[error,setError]=useState("");

  const guardar=async(e)=>{
    e.preventDefault();
    if(tipo==="otro"&&!tipoOtro.trim()){setError("Descríbenos de qué tipo es este caso.");return;}
    setError("");setGuardando(true);
    const payload={
      tipo, tipo_otro:tipo==="otro"?tipoOtro.trim():null,
      descripcion:descripcion.trim()||null,
      monto_reclamado:montoReclamado?parseFloat(montoReclamado):null,
      fecha_evento:fechaEvento||null,
      estatus,
      updated_at:new Date().toISOString()
    };
    let resultado;
    if(s){
      resultado=await sb.from("siniestros").update(payload).eq("id",s.id).select().single();
    }else{
      resultado=await sb.from("siniestros").insert({...payload,cliente_id:clienteId,creado_por:"agente"}).select().single();
    }
    setGuardando(false);
    if(resultado.error){setError(resultado.error.message);return;}
    onGuardado(resultado.data);
  };

  return <form onSubmit={guardar} style={{...est.card,marginBottom:24}}>
    <div style={{fontSize:16,fontWeight:700,marginBottom:16}}>{s?"Editar caso":"Nuevo caso"}</div>
    <Campo label="Tipo">
      <select value={tipo} onChange={e=>setTipo(e.target.value)} style={est.input}>
        {TIPOS_SINIESTRO.map(t=><option key={t.value} value={t.value}>{t.label}</option>)}
      </select>
    </Campo>
    {tipo==="otro"&&<Campo label="¿De qué tipo es?">
      <input value={tipoOtro} onChange={e=>setTipoOtro(e.target.value)} style={est.input}/>
    </Campo>}
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
      <Campo label="Fecha del evento">
        <input type="date" value={fechaEvento} onChange={e=>setFechaEvento(e.target.value)} style={est.input}/>
      </Campo>
      <Campo label="Monto reclamado (MXN)">
        <input type="number" step="0.01" min="0" value={montoReclamado} onChange={e=>setMontoReclamado(e.target.value)} style={est.input}/>
      </Campo>
    </div>
    <Campo label="Descripción">
      <textarea value={descripcion} onChange={e=>setDescripcion(e.target.value)} rows={3} style={est.input}/>
    </Campo>
    {s&&<Campo label="Estatus">
      <select value={estatus} onChange={e=>setEstatus(e.target.value)} style={est.input}>
        {ESTATUS_SINIESTRO.map(o=><option key={o.value} value={o.value}>{o.label}</option>)}
      </select>
    </Campo>}
    {error&&<div style={{color:"#dc2626",fontSize:13,marginBottom:10}}>{error}</div>}
    <div style={{display:"flex",gap:10}}>
      <Boton type="submit" disabled={guardando}>{guardando?"Guardando...":"Guardar"}</Boton>
      <button type="button" onClick={onCancelar} style={est.linkBtn}>Cancelar</button>
    </div>
  </form>;
}

function DocumentosSiniestro({siniestroId}){
  const[documentos,setDocumentos]=useState(null);
  const[subiendo,setSubiendo]=useState(false);
  const[error,setError]=useState("");

  const cargar=async()=>{
    const{data,error}=await sb.from("siniestro_documentos").select("*").eq("siniestro_id",siniestroId).order("created_at");
    if(error){setError(error.message);return;}
    setDocumentos(data);
  };
  useEffect(()=>{cargar()},[]);

  const subir=async(file)=>{
    if(!file)return;
    setSubiendo(true);setError("");
    const path=`${siniestroId}/${crypto.randomUUID()}-${file.name}`;
    const{error:errSubida}=await sb.storage.from("siniestros").upload(path,file);
    if(errSubida){setSubiendo(false);setError("No se pudo subir: "+errSubida.message);return;}
    const{error:errIns}=await sb.from("siniestro_documentos").insert({siniestro_id:siniestroId,path,nombre_archivo:file.name,subido_por:"agente"});
    setSubiendo(false);
    if(errIns){setError(errIns.message);return;}
    cargar();
  };

  const ver=async(doc)=>{
    const{data,error}=await sb.storage.from("siniestros").createSignedUrl(doc.path,60);
    if(error){setError("No se pudo abrir: "+error.message);return;}
    window.open(data.signedUrl,"_blank");
  };

  const eliminar=async(doc)=>{
    if(!window.confirm(`¿Eliminar "${doc.nombre_archivo||"este documento"}"?`))return;
    await sb.storage.from("siniestros").remove([doc.path]);
    await sb.from("siniestro_documentos").delete().eq("id",doc.id);
    cargar();
  };

  return <div style={{marginTop:10,paddingTop:10,borderTop:"1px solid #f1f5f9"}}>
    <div style={{fontSize:12,fontWeight:700,color:"#8FA0B4",marginBottom:6}}>DOCUMENTOS {documentos?`(${documentos.length})`:""}</div>
    {error&&<div style={{color:"#dc2626",fontSize:12,marginBottom:6}}>{error}</div>}
    {documentos&&documentos.length===0&&<div style={{fontSize:12.5,color:"#8FA0B4",marginBottom:6}}>Todavía no hay documentos.</div>}
    {documentos&&documentos.map(d=><div key={d.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"5px 0",fontSize:12.5}}>
      <span style={{color:"#374151",wordBreak:"break-all"}}>{d.nombre_archivo||"Documento"}{d.subido_por==="cliente"?" · subido por el cliente":""}</span>
      <div style={{display:"flex",gap:6,flexShrink:0}}>
        <button onClick={()=>ver(d)} style={{...est.linkBtn,padding:"2px 6px"}}>Ver</button>
        <button onClick={()=>eliminar(d)} style={{...est.linkBtn,padding:"2px 6px",color:"#dc2626"}}>Eliminar</button>
      </div>
    </div>)}
    <label style={{display:"inline-block",marginTop:6,fontSize:12,fontWeight:700,color:"#10284A",cursor:subiendo?"default":"pointer"}}>
      {subiendo?"Subiendo...":"+ Agregar documento"}
      <input type="file" onChange={e=>subir(e.target.files[0])} disabled={subiendo} style={{display:"none"}}/>
    </label>
  </div>;
}

function SiniestrosList({clienteId}){
  const[siniestros,setSiniestros]=useState(null);
  const[formAbierto,setFormAbierto]=useState(false);
  const[editando,setEditando]=useState(null);
  const[expandido,setExpandido]=useState(null);
  const[error,setError]=useState("");

  const cargar=async()=>{
    const{data,error}=await sb.from("siniestros").select("*").eq("cliente_id",clienteId).order("created_at",{ascending:false});
    if(error){setError(error.message);return;}
    setSiniestros(data);
  };
  useEffect(()=>{cargar()},[]);

  const eliminar=async(s)=>{
    if(!window.confirm("¿Eliminar este caso y todos sus documentos?"))return;
    const{data:docs}=await sb.from("siniestro_documentos").select("path").eq("siniestro_id",s.id);
    if(docs&&docs.length>0)await sb.storage.from("siniestros").remove(docs.map(d=>d.path));
    const{error}=await sb.from("siniestros").delete().eq("id",s.id);
    if(error){setError(error.message);return;}
    cargar();
  };

  return <div style={{marginBottom:32}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>

      onGuardado={()=>{setFormAbierto(false);cargar();}}
      onCancelar={()=>setFormAbierto(false)}/>}

    {editando&&<SiniestroForm clienteId={clienteId} siniestroExistente={editando}

    {!siniestros&&<div style={{color:"#6B7280",fontSize:14}}>Cargando...</div>}
    {siniestros&&siniestros.length===0&&!formAbierto&&<div style={{...est.card,textAlign:"center",color:"#6B7280"}}>

    {siniestros&&siniestros.map(s=>{
      const ei=estatusSiniestroInfo(s.estatus);
      return <div key={s.id} style={{...est.card,marginBottom:10}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
          <div>
            <div style={{fontWeight:700,fontSize:14}}>{etiquetaTipoSiniestro(s)}{s.creado_por==="cliente"&&<span style={{...est.badge("#F59E0B"),marginLeft:6}}>iniciado por el cliente</span>}</div>
            <div style={{fontSize:12,color:"#8FA0B4",marginTop:2}}>
              {s.fecha_evento?fecha(s.fecha_evento):""}{s.monto_reclamado?` · ${pesos(s.monto_reclamado)}`:""} · {new Date(s.created_at).toLocaleDateString("es-MX",{day:"numeric",month:"short",year:"numeric"})}
            </div>
            {s.descripcion&&<div style={{fontSize:13,color:"#374151",marginTop:6}}>{s.descripcion}</div>}
          </div>
          <span style={est.badge(ei.color)}>{ei.label}</span>
        </div>
        <div style={{marginTop:10,display:"flex",gap:4}}>
          <button onClick={()=>setEditando(s)} style={est.linkBtn}>Editar</button>
          <button onClick={()=>setExpandido(expandido===s.id?null:s.id)} style={est.linkBtn}>{expandido===s.id?"Ocultar documentos":"Ver documentos"}</button>
          <button onClick={()=>eliminar(s)} style={{...est.linkBtn,color:"#dc2626"}}>Eliminar</button>
        </div>
        {expandido===s.id&&<DocumentosSiniestro siniestroId={s.id}/>}
      </div>;
    })}
  </div>;
}

// RLS ya limita esto a solicitudes con promotoria_id = auth.uid() — nunca ve las de los clientes
// de sus agentes (esas son del inbox de cada agente en /app, no de la promotoría).
function SolicitudesInbox({onAbrirCliente}){
  const[solicitudes,setSolicitudes]=useState(null);
  const[error,setError]=useState("");

  const cargar=async()=>{
    const{data,error}=await sb.from("solicitudes").select("*,clientes(*),polizas(numero_poliza,ramo,aseguradora)").order("created_at",{ascending:false});
    if(error){setError(error.message);return;}
    setSolicitudes(data);
  };
  useEffect(()=>{cargar()},[]);

  const marcarAtendida=async(s)=>{
    const{error}=await sb.from("solicitudes").update({estatus:"atendida"}).eq("id",s.id);
    if(error){setError(error.message);return;}
    cargar();
  };

  const verFoto=async(s)=>{
    const{data,error}=await sb.storage.from("solicitudes").createSignedUrl(s.foto_path,60);
    if(error){setError("No se pudo abrir la foto: "+error.message);return;}
    window.open(data.signedUrl,"_blank");
  };

  if(error)return <div style={{color:"#dc2626",fontSize:13}}>{error}</div>;
  if(!solicitudes)return <div style={{color:"#6B7280",fontSize:14}}>Cargando...</div>;
  if(solicitudes.length===0)return <div style={{...est.card,textAlign:"center",color:"#6B7280"}}>Todavía no tienes solicitudes de tus clientes propios.</div>;

  return <div>
    {solicitudes.map(s=><div key={s.id} style={{...est.card,marginBottom:10,opacity:s.estatus==="atendida"?0.6:1}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
        <div>
          <div style={{fontWeight:700,fontSize:14}}>
            {s.tipo==="endoso"?"Endoso":"Cotización"} — {s.clientes?s.clientes.nombre:s.prospecto_nombre}
            {!s.cliente_id&&<span style={{...est.badge("#F59E0B"),marginLeft:6}}>prospecto</span>}
          </div>
          <div style={{fontSize:12,color:"#8FA0B4",marginTop:2}}>{s.tipo==="endoso"?s.tipo_cambio:s.ramo_interes}{" · "}{new Date(s.created_at).toLocaleString("es-MX",{day:"numeric",month:"short",hour:"numeric",minute:"2-digit"})}</div>
          {!s.cliente_id&&<div style={{fontSize:13,color:"#374151",marginTop:4}}>
            {s.prospecto_correo&&<span>{s.prospecto_correo}</span>}
            {s.prospecto_correo&&s.prospecto_telefono&&" · "}
            {s.prospecto_telefono&&<span>{s.prospecto_telefono}</span>}
          </div>}
          {s.polizas&&<div style={{fontSize:12,color:"#374151",marginTop:2}}>Sobre: {s.polizas.ramo} — {s.polizas.aseguradora||"Sin aseguradora"}{s.polizas.numero_poliza?` (${s.polizas.numero_poliza})`:""}</div>}
          {s.descripcion&&<div style={{fontSize:13,color:"#374151",marginTop:6}}>{s.descripcion}</div>}
        </div>
        <span style={est.badge(s.estatus==="nueva"?"#F59E0B":"#6b7280")}>{s.estatus}</span>
      </div>
      <div style={{marginTop:10,display:"flex",gap:4}}>
        {s.foto_path&&<button onClick={()=>verFoto(s)} style={est.linkBtn}>Ver foto</button>}
        {s.clientes&&<button onClick={()=>onAbrirCliente(s.clientes)} style={est.linkBtn}>Ir al cliente</button>}
        {s.estatus==="nueva"&&<button onClick={()=>marcarAtendida(s)} style={est.linkBtn}>Marcar atendida</button>}
      </div>
    </div>)}
  </div>;
}

function MiTarjetaPromotoria({promotoria,onPromotoriaCambiada}){
  const[alias,setAlias]=useState(promotoria.alias_publico||"");
  const[activa,setActiva]=useState(!!promotoria.tarjeta_activa);
  const[titulo,setTitulo]=useState(promotoria.tarjeta_titulo||"");
  const[bio,setBio]=useState(promotoria.tarjeta_bio||"");
  const[whatsapp,setWhatsapp]=useState(promotoria.tarjeta_whatsapp||"");
  const[correoPub,setCorreoPub]=useState(promotoria.tarjeta_correo_publico||"");
  const[foto,setFoto]=useState(null);
  const[guardando,setGuardando]=useState(false);
  const[guardado,setGuardado]=useState(false);
  const[error,setError]=useState("");
  const[copiado,setCopiado]=useState(false);

  const url=promotoria.alias_publico?`https://insurgest.upco.app/pr/${promotoria.alias_publico}`:null;

  const guardar=async(e)=>{
    e.preventDefault();
    setError("");setGuardado(false);setGuardando(true);

    let fotoPath=null,fotoUrl=null;
    if(foto){
      fotoPath=`${promotoria.id}/foto.jpg`;
      const{error:errSubida}=await sb.storage.from("tarjetas").upload(fotoPath,foto,{upsert:true,contentType:foto.type});
      if(errSubida){setGuardando(false);setError("No se pudo subir el logo: "+errSubida.message);return;}
      const{data:pub}=sb.storage.from("tarjetas").getPublicUrl(fotoPath);
      fotoUrl=`${pub.publicUrl}?v=${Date.now()}`;
    }

    const{error:err}=await sb.rpc("promotoria_guardar_tarjeta",{
      p_alias:alias,p_activa:activa,p_titulo:titulo||null,p_bio:bio||null,
      p_whatsapp:whatsapp||null,p_correo_publico:correoPub||null,p_foto_path:fotoPath,p_foto_url:fotoUrl
    });
    if(err){setGuardando(false);setError(err.message);return;}

    const{data:fresca}=await sb.from("promotorias").select("*").eq("id",promotoria.id).single();
    setGuardando(false);setGuardado(true);setFoto(null);
    if(fresca)onPromotoriaCambiada(fresca);
    setTimeout(()=>setGuardado(false),2000);
  };

  const copiar=()=>{navigator.clipboard.writeText(url);setCopiado(true);setTimeout(()=>setCopiado(false),1500);};

  return <div>
    <form onSubmit={guardar} style={{...est.card,maxWidth:520,marginBottom:14}}>
      <div style={{fontSize:16,fontWeight:700,marginBottom:4}}>Tarjeta digital de tu promotoría</div>
      <div style={{fontSize:13,color:"#6B7280",marginBottom:16}}>Una página para compartir con prospectos por WhatsApp o redes — a nombre de tu promotoría, no de un agente en particular.</div>

      <div style={est.label}>Dirección de tu tarjeta</div>
      <div style={{display:"flex",alignItems:"center",gap:4,marginBottom:2}}>
        <span style={{fontSize:13,color:"#8FA0B4"}}>insurgest.upco.app/pr/</span>
        <input name="alias" value={alias} onChange={e=>setAlias(e.target.value.toLowerCase().replace(/[^a-z0-9-]/g,""))}
          placeholder="tu-promotoria" style={{...est.input,flex:1}}/>
      </div>
      <div style={{fontSize:12,color:"#8FA0B4",marginTop:-8,marginBottom:14}}>Solo minúsculas, números y guiones. Elígela bien: es la que vas a compartir por WhatsApp.</div>

      <div style={est.label}>Logo (opcional)</div>
      <input name="foto" type="file" accept="image/*" onChange={e=>setFoto(e.target.files[0]||null)} style={{fontSize:14,marginBottom:14}}/>
      {promotoria.tarjeta_foto_url&&!foto&&<div style={{marginBottom:14}}>
        <img src={promotoria.tarjeta_foto_url} alt="Tu logo" style={{width:70,height:70,borderRadius:"50%",objectFit:"cover",border:"2px solid #DDE4EE"}}/>
      </div>}

      <div style={est.label}>Título</div>
      <input name="titulo" value={titulo} onChange={e=>setTitulo(e.target.value)} placeholder="Promotoría de seguros" style={est.input}/>

      <div style={est.label}>Presentación</div>
      <textarea name="bio" value={bio} onChange={e=>setBio(e.target.value)} rows={3}
        placeholder="Dos o tres líneas sobre tu promotoría y a quién ayuda." style={{...est.input,resize:"vertical",fontFamily:"inherit"}}/>

      <div style={est.label}>WhatsApp de la promotoría</div>
      <input name="whatsapp" value={whatsapp} onChange={e=>setWhatsapp(e.target.value)} placeholder="5512345678" style={est.input}/>
      {whatsapp.replace(/\D/g,"").length>0&&whatsapp.replace(/\D/g,"").length!==10&&whatsapp.replace(/\D/g,"").length!==12&&
        <div style={{fontSize:12,color:"#dc2626",marginTop:-8,marginBottom:14}}>
          Ese número lleva {whatsapp.replace(/\D/g,"").length} dígitos. Un celular mexicano lleva 10 (o 12 con el 52 al inicio). Si lo dejas así, el botón de WhatsApp no va a aparecer en tu tarjeta.
        </div>}

      <div style={est.label}>Correo público</div>
      <input name="correo_publico" type="email" value={correoPub} onChange={e=>setCorreoPub(e.target.value)} placeholder="contacto@tupromotoria.com" style={est.input}/>
      <div style={{fontSize:12,color:"#8FA0B4",marginTop:-8,marginBottom:14}}>
        Es el correo que verán los prospectos en la tarjeta. Los avisos de prospectos nuevos te seguimos mandando a {promotoria.correo}.
      </div>

      <label style={{display:"flex",alignItems:"center",gap:8,fontSize:14,marginBottom:14,cursor:"pointer"}}>
        <input type="checkbox" checked={activa} onChange={e=>setActiva(e.target.checked)}/>
        Publicar mi tarjeta (si la apagas, deja de abrirse para todos)
      </label>

      {error&&<div style={{color:"#dc2626",fontSize:13,marginBottom:10}}>{error}</div>}
      <Boton type="submit" disabled={guardando}>{guardando?"Guardando...":guardado?"¡Guardado!":"Guardar tarjeta"}</Boton>
    </form>

    {url&&promotoria.tarjeta_activa&&<div style={{...est.card,maxWidth:520,marginBottom:14}}>
      <div style={{fontSize:13,fontWeight:700,color:"#8FA0B4",marginBottom:8}}>TU TARJETA ESTÁ PUBLICADA</div>
      <div style={{fontSize:14,wordBreak:"break-all",marginBottom:10,color:"#10284A"}}>{url}</div>
      <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
        <Boton onClick={copiar}>{copiado?"¡Copiada!":"Copiar liga"}</Boton>
        <a href={url} target="_blank" rel="noopener"><Boton color="#F59E0B">Verla</Boton></a>
      </div>
    </div>}
  </div>;
}

function ProspectosPromotoria(){
  const[prospectos,setProspectos]=useState(null);
  const[error,setError]=useState("");

  const cargar=async()=>{
    const{data,error}=await sb.rpc("promotoria_prospectos");
    if(error){setError(error.message);return;}
    setProspectos(data||[]);
  };
  useEffect(()=>{cargar()},[]);

  const marcar=async(p,estatus)=>{
    const{error}=await sb.rpc("promotoria_marcar_prospecto",{p_id:p.id,p_estatus:estatus});
    if(error){setError(error.message);return;}
    cargar();
  };

  if(error)return <div style={{color:"#dc2626",fontSize:13}}>{error}</div>;
  if(!prospectos)return <div style={{color:"#6B7280",fontSize:14}}>Cargando...</div>;
  if(prospectos.length===0)return <div style={{...est.card,textAlign:"center",color:"#6B7280"}}>Todavía no ha llegado ningún prospecto desde tu tarjeta.</div>;

  return <div>
    {prospectos.map(p=><div key={p.id} style={{...est.card,marginBottom:10,opacity:p.estatus==="atendida"?0.6:1}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
        <div>
          <div style={{fontWeight:700,fontSize:14}}>{p.nombre}</div>
          <div style={{fontSize:12,color:"#8FA0B4",marginTop:2}}>
            {p.correo}{p.telefono?` · ${p.telefono}`:""}{p.ramo_interes?` · ${p.ramo_interes}`:""}{" · "}
            {new Date(p.created_at).toLocaleString("es-MX",{day:"numeric",month:"short",hour:"numeric",minute:"2-digit"})}
          </div>
          {p.descripcion&&<div style={{fontSize:13,color:"#374151",marginTop:6}}>{p.descripcion}</div>}
        </div>
        <span style={est.badge(p.estatus==="nueva"?"#F59E0B":"#6b7280")}>{p.estatus}</span>
      </div>
      <div style={{marginTop:10}}>
        <button onClick={()=>marcar(p,p.estatus==="nueva"?"atendida":"nueva")} style={est.linkBtn}>
          {p.estatus==="nueva"?"Marcar atendida":"Reabrir"}
        </button>
      </div>
    </div>)}
  </div>;
}

function PanelAgenteLibreVista({agenteLibre,onSalir}){
  const[pendiente,setPendiente]=useState(null);
  const[acumulado,setAcumulado]=useState(null);
  const[copiado,setCopiado]=useState(false);
  const[solicitando,setSolicitando]=useState(false);
  const[mensaje,setMensaje]=useState("");
  const[error,setError]=useState("");

  const cargar=()=>{
    sb.rpc("mi_residual_pendiente").then(({data})=>setPendiente(data));
    sb.rpc("mi_residual_acumulado_anio").then(({data})=>setAcumulado(data));
  };
  useEffect(()=>{cargar()},[]);

  const copiar=async()=>{
    try{await navigator.clipboard.writeText(agenteLibre.codigo_invitacion);setCopiado(true);setTimeout(()=>setCopiado(false),2000);}catch(e){}
  };

  const solicitar=async()=>{
    setError("");setMensaje("");setSolicitando(true);
    const{data,error:err}=await sb.rpc("solicitar_residual");
    setSolicitando(false);
    if(err){setError(err.message);return;}
    setMensaje(`Listo, solicitaste ${pesos(data.monto)}. Te avisamos en cuanto quede pagada.`);
    cargar();
  };

  const hayPendiente=pendiente&&pendiente.pendiente_por_solicitar>0;

  return <div style={{maxWidth:520,margin:"0 auto",padding:"24px 16px 60px"}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
      <div style={{fontSize:16,fontWeight:700,color:"#10284A"}}>Hola, {agenteLibre.nombre_negocio||agenteLibre.nombre||agenteLibre.correo}</div>
      <button onClick={onSalir} style={{background:"none",border:"none",color:"#6B7280",fontSize:14,cursor:"pointer"}}>Salir ({agenteLibre.correo})</button>
    </div>

    <div style={{...est.card,marginBottom:20,background:"#F4F7FB"}}>
      <div style={{fontSize:13,fontWeight:700,color:"#8FA0B4",marginBottom:8}}>TU CÓDIGO</div>
      <div style={{fontSize:13,color:"#374151",marginBottom:10,lineHeight:1.5}}>Compártelo con agentes, promotorías o agencias máster — al registrarse y capturarlo, quedan ligados a tu red.</div>
      <div style={{display:"flex",alignItems:"center",gap:10}}>
        <div style={{background:"#fff",border:"1px solid #DDE4EE",borderRadius:10,padding:"10px 16px",fontSize:20,fontWeight:800,letterSpacing:2,color:"#10284A"}}>{agenteLibre.codigo_invitacion}</div>
        <Boton color="#53647D" onClick={copiar}>{copiado?"¡Copiado!":"Copiar"}</Boton>
      </div>
    </div>

    <div style={{...est.card,background:"linear-gradient(160deg,#173863,#0a1c35)"}}>
      <div style={{fontSize:13,fontWeight:700,color:"#F59E0B",marginBottom:6}}>🎁 TU COMISIÓN</div>
      <div style={{fontSize:12.5,color:"#C7D3E3",lineHeight:1.5,marginBottom:14}}>17% sobre cada agente que refieras directamente, 3% sobre la cuota de cada promotoría o agencia máster que refieras. Se acumula y la solicitas cuando quieras.</div>
      <div style={{marginBottom:hayPendiente?16:0}}>
        <div style={{fontSize:22,fontWeight:700,color:"#fff"}}>{acumulado==null?"—":pesos(acumulado)}</div>
        <div style={{fontSize:11,color:"#8FA0B4"}}>ACUMULADO ESTE AÑO</div>
      </div>
      {hayPendiente&&<div style={{borderTop:"1px solid rgba(255,255,255,.15)",paddingTop:14}}>
        <div style={{fontSize:13,color:"#C7D3E3",marginBottom:10}}>Tienes <b style={{color:"#fff"}}>{pesos(pendiente.pendiente_por_solicitar)}</b> sin solicitar.</div>
        {mensaje&&<div style={{color:"#86efac",fontSize:13,marginBottom:10}}>{mensaje}</div>}
        {error&&<div style={{color:"#fca5a5",fontSize:13,marginBottom:10}}>{error}</div>}
        {!pendiente.solicitud_abierta&&<Boton onClick={solicitar} disabled={solicitando}>{solicitando?"Solicitando...":"Solicitar pago"}</Boton>}
        {pendiente.solicitud_abierta&&<div style={{fontSize:12.5,color:"#C7D3E3"}}>Ya tienes una solicitud en proceso.</div>}
      </div>}
    </div>
  </div>;
}

function PanelPromotoria({session,onSalir}){
  const[promotoria,setPromotoria]=useState(null);
  const[agenteLibre,setAgenteLibre]=useState(null);
  const[vista,setVista]=useState("resumen");
  const[clienteActivo,setClienteActivo]=useState(null);
  const[error,setError]=useState("");

  useEffect(()=>{
    (async()=>{
      // Si ya es Agente Libre (reclamado en un login anterior), ese es su panel — nunca
      // llega a crear/leer una fila de promotorías.
      const{data:libreExistente}=await sb.from("agentes_libres").select("*").eq("id",session.user.id).maybeSingle();
      if(libreExistente){setAgenteLibre(libreExistente);return;}

      const{data,error:errSel}=await sb.from("promotorias").select("*").eq("id",session.user.id).maybeSingle();
      if(errSel){setError(errSel.message);return;}
      if(data){setPromotoria(data);return;}
      const meta=session.user.user_metadata||{};

      // Primer login tras el registro: si el código capturado es una semilla de Agente Libre
      // sin reclamar, esta persona SE CONVIERTE en Agente Libre — no se crea promotoría.
      if(meta.codigo_libre){
        const{data:reclamo}=await sb.rpc("reclamar_agente_libre",{
          p_codigo:meta.codigo_libre,p_nombre:meta.nombre||null,p_nombre_negocio:meta.nombre_negocio||null,
          p_rfc:meta.rfc||null,p_acepto_terminos:meta.acepto_terminos||false,
          p_acepto_terminos_version:meta.acepto_terminos_version||null,p_acepto_terminos_fecha:meta.acepto_terminos_fecha||null
        });
        if(reclamo&&reclamo.reclamado){
          const{data:nuevoLibre}=await sb.from("agentes_libres").select("*").eq("id",session.user.id).maybeSingle();
          setAgenteLibre(nuevoLibre);
          return;
        }
      }

      let agenciaId=null;
      let agenteLibreId=null;
      if(meta.codigo_agencia){
        const{data:idResuelto}=await sb.rpc("resolver_codigo_agencia",{p_codigo:meta.codigo_agencia});
        agenciaId=idResuelto||null;
      }
      if(meta.codigo_libre){
        const{data:idLibre}=await sb.rpc("resolver_codigo_agente_libre",{p_codigo:meta.codigo_libre});
        agenteLibreId=idLibre||null;
      }
      const{data:nueva,error:errIns}=await sb.from("promotorias")
        .insert({
          id:session.user.id,correo:session.user.email,
          nombre:meta.nombre||null,nombre_negocio:meta.nombre_negocio||null,rfc:meta.rfc||null,
          acepto_terminos:meta.acepto_terminos||false,acepto_terminos_version:meta.acepto_terminos_version||null,acepto_terminos_fecha:meta.acepto_terminos_fecha||null,
          agencia_maestra_id:agenciaId,agente_libre_id:agenteLibreId
        })
        .select().single();
      if(errIns){
        if(errIns.code==="23505"){
          const{data:existente,error:errSel2}=await sb.from("promotorias").select("*").eq("id",session.user.id).maybeSingle();
          if(errSel2){setError(errSel2.message);return;}
          if(existente){setPromotoria(existente);return;}
        }
        setError(errIns.message);return;
      }
      setPromotoria(nueva);
    })();
  },[]);

  if(error)return <div style={{padding:40,textAlign:"center",color:"#dc2626"}}>Ocurrió un error: {error}</div>;
  if(agenteLibre)return <PanelAgenteLibreVista agenteLibre={agenteLibre} onSalir={onSalir}/>;
  if(!promotoria)return <div style={{padding:40,textAlign:"center",color:"#6B7280"}}>Cargando tu panel...</div>;

  if(promotoria.estatus_aprobacion==="pendiente")return <div style={{minHeight:`calc(100vh - ${ALTO_HEADER}px)`,display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
    <div style={{background:"#fff",borderRadius:16,padding:28,width:"100%",maxWidth:420,boxShadow:"0 8px 30px rgba(0,0,0,.08)",textAlign:"center"}}>
      <div style={{fontSize:18,fontWeight:800,marginBottom:12,color:"#10284A"}}>Cuenta pendiente de aprobación</div>
      <div style={{fontSize:14,color:"#374151",lineHeight:1.6,marginBottom:20}}>Te avisaremos por correo en cuanto podamos activar tu portal de promotoría.</div>
      <button onClick={onSalir} style={est.linkBtn}>Salir</button>
    </div>
  </div>;

  if(promotoria.estatus_aprobacion==="rechazado")return <div style={{minHeight:`calc(100vh - ${ALTO_HEADER}px)`,display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
    <div style={{background:"#fff",borderRadius:16,padding:28,width:"100%",maxWidth:420,boxShadow:"0 8px 30px rgba(0,0,0,.08)",textAlign:"center"}}>
      <div style={{fontSize:18,fontWeight:800,marginBottom:12,color:"#10284A"}}>Solicitud no aprobada</div>
      <div style={{fontSize:14,color:"#374151",lineHeight:1.6,marginBottom:20}}>Tu solicitud de registro no fue aprobada. Si crees que es un error, contáctanos.</div>
      <button onClick={onSalir} style={est.linkBtn}>Salir</button>
    </div>
  </div>;

  if(!accesoVigente(promotoria))return <div>
    <div style={{maxWidth:760,margin:"0 auto",padding:"16px 16px 0",display:"flex",justifyContent:"flex-end"}}>
      <button onClick={onSalir} style={{background:"none",border:"none",color:"#6B7280",fontSize:14,cursor:"pointer"}}>Salir ({promotoria.correo})</button>
    </div>
    <PantallaSuscripcionPromotoria cuenta={promotoria} bloqueado={true}/>
  </div>;

  return <div style={{maxWidth:760,margin:"0 auto",padding:"24px 16px 60px"}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
      <div style={{fontSize:16,fontWeight:700,color:"#10284A"}}>Hola, {promotoria.nombre_negocio||promotoria.correo}</div>
      <button onClick={onSalir} style={{background:"none",border:"none",color:"#6B7280",fontSize:14,cursor:"pointer"}}>Salir ({promotoria.correo})</button>
    </div>

    {!clienteActivo&&<div style={{display:"flex",gap:16,marginBottom:24,borderBottom:"1px solid #DDE4EE",flexWrap:"wrap"}}>
      <button onClick={()=>setVista("resumen")} style={tabStyle(vista==="resumen")}>Resumen</button>
      <button onClick={()=>setVista("clientes")} style={tabStyle(vista==="clientes")}>Mis clientes</button>
      <button onClick={()=>setVista("solicitudes")} style={tabStyle(vista==="solicitudes")}>Solicitudes</button>
      <button onClick={()=>setVista("agentes")} style={tabStyle(vista==="agentes")}>Agentes</button>
      <button onClick={()=>setVista("avisos")} style={tabStyle(vista==="avisos")}>Avisos</button>
      <button onClick={()=>setVista("tarjeta")} style={tabStyle(vista==="tarjeta")}>Mi tarjeta</button>
      <button onClick={()=>setVista("prospectos")} style={tabStyle(vista==="prospectos")}>Prospectos</button>
      <button onClick={()=>setVista("suscripcion")} style={tabStyle(vista==="suscripcion")}>Suscripción</button>
      <a href="../ayuda/" target="_blank" rel="noopener" style={tabStyle(false)}>Ayuda</a>
    </div>}

    {clienteActivo
      ?<ClienteDetalle cliente={clienteActivo} promotoriaId={promotoria.id}
          onVolver={()=>setClienteActivo(null)}
          onClienteCambiado={(actualizado)=>setClienteActivo(actualizado)}/>
      :vista==="resumen"?<Resumen codigo={promotoria.codigo_invitacion}/>
      :vista==="clientes"?<ClientesList promotoriaId={promotoria.id} onAbrirCliente={setClienteActivo}/>
      :vista==="solicitudes"?<SolicitudesInbox onAbrirCliente={(c)=>{setClienteActivo(c);setVista("clientes");}}/>
      :vista==="avisos"?<AvisosPromotoria promotoriaId={promotoria.id}/>
      :vista==="tarjeta"?<MiTarjetaPromotoria promotoria={promotoria} onPromotoriaCambiada={setPromotoria}/>
      :vista==="prospectos"?<ProspectosPromotoria/>
      :vista==="suscripcion"?<PantallaSuscripcionPromotoria cuenta={promotoria} bloqueado={false}/>
      :<Agentes/>}
  </div>;
}

// La sesión se comparte entre /app y /promotor (mismo dominio), así que quien active el segundo
// factor desde su panel de agente también llega aquí en aal1. Sin esta pantalla, la política
// restrictiva de la base le negaría su propia fila y el portal no cargaría nunca.
function PedirSegundoFactor({onOk,onSalir}){
  const[codigo,setCodigo]=useState("");
  const[respaldo,setRespaldo]=useState("");
  const[modo,setModo]=useState("totp");
  const[error,setError]=useState("");
  const[verificando,setVerificando]=useState(false);

  const verificar=async(e)=>{
    e.preventDefault();setError("");
    if(!/^[0-9]{6}$/.test(codigo)){setError("Escribe los 6 dígitos de tu app.");return;}
    setVerificando(true);
    const{data:f}=await sb.auth.mfa.listFactors();
    const factor=(f&&f.totp&&f.totp[0])||null;
    if(!factor){setVerificando(false);setError("No encontramos tu método de verificación.");return;}
    const{error:err}=await sb.auth.mfa.challengeAndVerify({factorId:factor.id,code:codigo});
    setVerificando(false);
    if(err){setError("Ese código no es válido. Revisa que tu reloj esté en hora e inténtalo otra vez.");return;}
    onOk();
  };

  const usarRespaldo=async(e)=>{
    e.preventDefault();setError("");
    if(respaldo.trim().length<8){setError("Escribe uno de tus códigos de respaldo completo.");return;}
    setVerificando(true);
    const{error:err}=await sb.rpc("usar_codigo_respaldo",{p_codigo:respaldo});
    setVerificando(false);
    if(err){setError(err.message);return;}
    alert("Listo. Te desactivamos la verificación en dos pasos para que puedas entrar. Vuelve a activarla desde tu panel de agente con tu teléfono nuevo.");
    location.reload();
  };

  const caja=(contenido)=><div style={{minHeight:`calc(100vh - ${ALTO_HEADER}px)`,display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
    <div style={{background:"#fff",borderRadius:16,padding:26,width:"100%",maxWidth:380,boxShadow:"0 8px 30px rgba(0,0,0,.08)"}}>{contenido}</div>
  </div>;

  if(modo==="respaldo")return caja(<>
    <form onSubmit={usarRespaldo}>
      <div style={{fontSize:18,fontWeight:800,color:"#10284A",marginBottom:6}}>¿Perdiste tu teléfono?</div>
      <div style={{fontSize:13.5,color:"#374151",lineHeight:1.5,marginBottom:16}}>
        Escribe uno de tus códigos de respaldo. Vamos a <strong>desactivarte la verificación en dos pasos</strong> para que puedas entrar, y la vuelves a activar con tu teléfono nuevo.
      </div>
      <input value={respaldo} onChange={e=>setRespaldo(e.target.value.toUpperCase())} placeholder="XXXXX-XXXXX" name="respaldo" autoFocus
        style={{width:"100%",padding:"14px",border:"1.5px solid #DDE4EE",borderRadius:10,fontSize:18,letterSpacing:2,textAlign:"center",fontFamily:"ui-monospace,Consolas,monospace",marginBottom:10}}/>
      {error&&<div style={{color:"#dc2626",fontSize:13,marginBottom:10}}>{error}</div>}
      <Boton type="submit" disabled={verificando}>{verificando?"Verificando...":"Usar este código"}</Boton>
    </form>
    <button onClick={()=>{setModo("totp");setError("");}} style={{background:"none",border:"none",color:"#53647D",fontSize:12.5,cursor:"pointer",marginTop:14,padding:0}}>Sí tengo mi teléfono</button>
  </>);

  return caja(<>
    <form onSubmit={verificar}>
      <div style={{fontSize:18,fontWeight:800,color:"#10284A",marginBottom:6}}>Verificación en dos pasos</div>
      <div style={{fontSize:13.5,color:"#374151",lineHeight:1.5,marginBottom:16}}>Abre tu app de autenticación y escribe el código de 6 dígitos.</div>
      <input value={codigo} onChange={e=>setCodigo(e.target.value.replace(/\D/g,"").slice(0,6))}
        type="tel" inputMode="numeric" placeholder="••••••" name="codigo" autoFocus
        style={{width:"100%",padding:"14px",border:"1.5px solid #DDE4EE",borderRadius:10,fontSize:26,letterSpacing:"12px",textAlign:"center",fontFamily:"inherit",marginBottom:10}}/>
      {error&&<div style={{color:"#dc2626",fontSize:13,marginBottom:10}}>{error}</div>}
      <Boton type="submit" disabled={verificando}>{verificando?"Verificando...":"Entrar"}</Boton>
    </form>
    <div style={{fontSize:12.5,color:"#374151",lineHeight:1.5,marginTop:16,paddingTop:14,borderTop:"1px solid #DDE4EE"}}>
      <strong>¿Perdiste o cambiaste de teléfono?</strong> Escríbenos a <a href="mailto:hola@upco.app?subject=Perdí mi teléfono — verificación en dos pasos" style={{color:"#10284A",fontWeight:700}}>hola@upco.app</a> y te lo quitamos para que puedas entrar.
      <div style={{marginTop:8}}>
        <button onClick={()=>{setModo("respaldo");setError("");}} style={{background:"none",border:"none",color:"#53647D",fontSize:12.5,cursor:"pointer",padding:0,textDecoration:"underline"}}>
          Tengo un código de respaldo
        </button>
      </div>
    </div>
    <div><button onClick={onSalir} style={{background:"none",border:"none",color:"#53647D",fontSize:12.5,cursor:"pointer",marginTop:14,padding:0}}>Cerrar sesión</button></div>
  </>);
}

function App(){
  const[sesion,setSesion]=useState(undefined);
  const[mfa,setMfa]=useState("revisando");
  useEffect(()=>{
    sb.auth.getSession().then(({data})=>setSesion(data.session||null));
    const{data:sub}=sb.auth.onAuthStateChange((_e,s)=>setSesion(s));
    return ()=>sub.subscription.unsubscribe();
  },[]);

  useEffect(()=>{
    if(!sesion){setMfa("revisando");return;}
    sb.auth.mfa.getAuthenticatorAssuranceLevel().then(({data})=>{
      if(data&&data.nextLevel==="aal2"&&data.currentLevel!=="aal2")setMfa("pedir");
      else setMfa("ok");
    }).catch(()=>setMfa("ok"));
  },[sesion]);

  const salir=()=>sb.auth.signOut();
  const cargando=<div style={{padding:40,textAlign:"center",color:"#6B7280"}}>Cargando...</div>;

  return <>
    <HeaderBar/>
    {sesion===undefined
      ?cargando
      :!sesion
        ?<Login/>
        :mfa==="revisando"
          ?cargando
          :mfa==="pedir"
            ?<PedirSegundoFactor onOk={()=>setMfa("ok")} onSalir={salir}/>
            :<PanelPromotoria session={sesion} onSalir={salir}/>}
  </>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
