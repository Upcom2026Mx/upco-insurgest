<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Upco InsurGest — Portal de promotoría</title>
<meta name="robots" content="noindex, nofollow"/>
<link rel="icon" href="../icon-192.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="../estilos.css"/>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:'Segoe UI',Arial,sans-serif;background:linear-gradient(180deg,#F8FAFC 0%,#F0F4F9 380px);color:#0a1c35;min-height:100vh}

  /* ── Pantalla de bienvenida ──
     "Insurance" y "Gestión" caen desde arriba y se les colapsa la terminación hasta formar
     "InsurGest". Mismo mecanismo que el splash de Homey ("Home"+"money" → "Homey"), en vertical. */
  #splash{position:fixed;inset:0;z-index:9999;background:linear-gradient(160deg,#10284A,#0a1c35);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;transition:opacity .6s ease;padding:24px}
  #splash.oculto{opacity:0;pointer-events:none}
  #splash .mono{border-radius:24px;box-shadow:0 16px 44px rgba(0,0,0,.45);line-height:0;opacity:0;transform:scale(.82) translateY(8px);animation:sLogo .9s cubic-bezier(.2,.7,.3,1) .1s forwards}
  #splash .marca{font-size:28px;font-weight:800;color:#fff;margin-top:8px;display:flex;align-items:baseline;gap:8px;white-space:nowrap}
  #splash .upco{opacity:0;animation:sFade .5s ease .4s forwards}
  #splash .ig{display:inline-flex;color:#F59E0B;animation:sGrow .5s ease 2.5s forwards}
  #splash .insur{display:inline-flex;opacity:0;transform:translateY(-28px);animation:sBaja .6s cubic-bezier(.2,.7,.3,1) 1s forwards}
  #splash .gest{display:inline-flex;opacity:0;transform:translateY(-28px);animation:sBaja .6s cubic-bezier(.2,.7,.3,1) 1.7s forwards}
  #splash .cae{display:inline-block;overflow:hidden;max-width:110px;animation:sColapsa .5s ease 2.5s forwards}
  #splash .esp{max-width:9px}
  #splash .sub{font-size:15px;font-weight:500;color:#8FA0B4;opacity:0;animation:sFade .5s ease 3.1s forwards;text-align:center}
  #splash .barra{width:120px;height:4px;border-radius:99px;background:rgba(255,255,255,.18);overflow:hidden;opacity:0;animation:sFade .4s ease .3s forwards}
  #splash .barra i{display:block;height:100%;width:40%;border-radius:99px;background:#F59E0B;animation:sCarga 1.1s ease-in-out .3s infinite}
  @keyframes sLogo{to{opacity:1;transform:scale(1) translateY(0)}}
  @keyframes sFade{to{opacity:1}}
  @keyframes sCarga{0%{margin-left:-40%}100%{margin-left:120%}}
  @keyframes sBaja{to{opacity:1;transform:translateY(0)}}
  @keyframes sColapsa{to{max-width:0;opacity:0}}
  @keyframes sGrow{0%{transform:scale(1)}60%{transform:scale(1.15)}100%{transform:scale(1.05)}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="../shared.js"></script>
</head>
<body>
<div id="splash">
  <div class="mono"><svg width="84" height="84" viewBox="0 0 38 38"><rect width="38" height="38" rx="11" fill="#10284A"/><text x="19" y="25" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-weight="800" font-size="14" fill="#F59E0B">IG</text></svg></div>
  <div class="marca">
    <span class="upco">Upco</span>
    <span class="ig"><span class="insur">Insur<span class="cae">ance</span></span><span class="cae esp">&nbsp;</span><span class="gest">Gest<span class="cae">or</span></span></span>
  </div>
  <div class="sub">Portal de promotoría</div>
  <div class="barra"><i></i></div>
</div>
<script>
// Va aquí, junto al splash y no al final del archivo, para que corra mientras el navegador
// todavía está armando la página: si esperara al final, quien ya lo vio alcanzaría a ver un
// parpadeo antes de que lo quitemos.
(function(){
  var s=document.getElementById("splash");
  if(!s)return;
  var quieto=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  // Una sola vez por sesión: quien entra a trabajar varias veces al día no necesita esperar
  // la animación cada vez.
  if(quieto||sessionStorage.getItem("upco_ig_splash")){s.remove();return;}
  try{sessionStorage.setItem("upco_ig_splash","1");}catch(e){}
  setTimeout(function(){s.classList.add("oculto");setTimeout(function(){s.remove();},700);},3800);
})();
</script>
<div id="root"></div>
<script type="text/babel">
const{useState,useEffect,useMemo}=React;

const VERSION_TERMINOS="2026-08-01";

// ============ Constantes de cartera (clientes/vehículos/pólizas) — mismas que /app ============
const FORMAS_PAGO=["anual","semestral","trimestral","mensual"];
const ESTATUS_POLIZA=["vigente","vencida","renovada","cancelada"];
const DURACIONES=[{value:"1",label:"1 año"},{value:"2",label:"2 años"},{value:"custom",label:"Personalizada"}];
const TIPOS_VEHICULO=["familiar","comercial","carga"];
const TIPOS_CARGA=["A","B","C"];
const UN_ANIO_SEGUNDOS=60*60*24*365;
const LIMITE_STORAGE_BYTES=5*1024*1024*1024; // 5 GB por promotoría, para PDFs de pólizas

function sumarAnios(fechaISO,anios){
  const d=new Date(fechaISO+"T00:00:00");
  d.setFullYear(d.getFullYear()+anios);
  return d.toISOString().slice(0,10);
}

const est={
  input:{width:"100%",padding:"13px 15px",border:"1.5px solid #DDE4EE",borderRadius:10,fontSize:15,marginBottom:10,fontFamily:"inherit"},
  label:{fontSize:12,fontWeight:700,color:"#8FA0B4",marginBottom:4,display:"block"},
  card:{background:"#fff",borderRadius:16,padding:22,border:"1px solid rgba(16,40,74,.08)",boxShadow:"0 3px 12px rgba(16,28,53,.07), 0 1px 3px rgba(16,28,53,.05)"},
  fila:{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"14px 16px",borderBottom:"1px solid #f1f5f9"},
  linkBtn:{background:"none",border:"none",color:"#53647D",fontSize:13,cursor:"pointer",padding:"4px 8px"},
  badge:(color)=>({display:"inline-block",fontSize:11,fontWeight:700,color,background:color+"1a",borderRadius:7,padding:"3px 9px"})
};

const ALTO_HEADER=54;
function HeaderBar(){
  return <div style={{background:"linear-gradient(135deg,#173863,#0a1c35)",padding:"14px 20px",display:"flex",alignItems:"center",justifyContent:"center",gap:10,height:ALTO_HEADER,boxShadow:"0 2px 14px rgba(10,28,53,.25)"}}>
    <a href="../" style={{color:"#fff",fontWeight:700,fontSize:18,fontFamily:"var(--font-display)",display:"inline-flex",alignItems:"center",gap:8,textDecoration:"none"}}><span className="brand-logo"></span> <span style={{color:"#F59E0B"}}>InsurGest</span></a>
    <span style={{color:"#fff",fontSize:12,fontWeight:600,background:"rgba(255,255,255,.15)",borderRadius:20,padding:"3px 10px"}}>Portal de Promotoría</span>
  </div>;
}

const VARIANTE_BOTON={"#10284A":"btn-navy","#F59E0B":"btn-amber","#53647D":"btn-neutral","#16a34a":"btn-good"};
function Boton({children,onClick,disabled,color="#10284A",type="button"}){
  return <button type={type} onClick={onClick} disabled={disabled} className={`btn ${VARIANTE_BOTON[color]||"btn-navy"}`}>
    {children}
  </button>;
}

// Botón "ver/ocultar" para campos de contraseña — se coloca dentro de un contenedor
// position:relative junto al <input>, con paddingRight en el input para no taparlo.
function BotonVerClave({mostrar,onClick}){
  return <button type="button" onClick={onClick} aria-label={mostrar?"Ocultar contraseña":"Mostrar contraseña"} tabIndex={-1}
    style={{position:"absolute",right:2,top:0,bottom:0,width:38,background:"none",border:"none",cursor:"pointer",color:"#8FA0B4",display:"flex",alignItems:"center",justifyContent:"center"}}>
    {mostrar
      ? <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a21.77 21.77 0 0 1 5.06-6.06M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a21.77 21.77 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
      : <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>}
  </button>;
}

function Campo({label,children}){
  return <div>{label&&<label style={est.label}>{label}</label>}{children}</div>;
}

function Login(){
  const[modo,setModo]=useState(new URLSearchParams(location.search).get("registro")?"registro":"entrar"); // entrar | registro
  const[email,setEmail]=useState("");
  const[password,setPassword]=useState("");
  const[mostrarClave,setMostrarClave]=useState(false);
  const[nombre,setNombre]=useState("");
  const[nombreNegocio,setNombreNegocio]=useState("");
  const[rfc,setRfc]=useState("");
  const[codigoAgencia,setCodigoAgencia]=useState("");
  const[codigoLibre,setCodigoLibre]=useState("");
  const[aceptoTerminos,setAceptoTerminos]=useState(false);
  const[error,setError]=useState("");
  const[cargando,setCargando]=useState(false);
  const[registroListo,setRegistroListo]=useState(false);

  const entrar=async(e)=>{
    e.preventDefault();
    if(!email||!email.includes("@")){setError("Escribe un correo válido.");return;}
    if(!password){setError("Escribe tu contraseña.");return;}
    setError("");setCargando(true);
    const{error}=await sb.auth.signInWithPassword({email:email.trim(),password});
    setCargando(false);
    if(error){setError(`Correo o contraseña incorrectos. (${error.message||"sin detalle"})`);return;}
  };

  const registrar=async(e)=>{
    e.preventDefault();
    if(!email||!email.includes("@")){setError("Escribe un correo válido.");return;}
    if(!nombreNegocio.trim()){setError("Escribe el nombre de tu promotoría.");return;}
    if(!password||password.length<6){setError("La contraseña debe tener al menos 6 caracteres.");return;}
    if(!aceptoTerminos){setError("Debes aceptar los Términos y Condiciones y el Aviso de Privacidad para registrarte.");return;}
    setError("");setCargando(true);
    const{data,error}=await sb.auth.signUp({
      email:email.trim(),
      password,
      options:{data:{
        nombre:nombre.trim()||null,
        nombre_negocio:nombreNegocio.trim(),
        rfc:rfc.trim()||null,
        codigo_agencia:codigoAgencia.trim()||null,
        codigo_libre:codigoLibre.trim()||null,
        acepto_terminos:true,
        acepto_terminos_version:VERSION_TERMINOS,
        acepto_terminos_fecha:new Date().toISOString()
      }}
    });
    setCargando(false);
    if(error){setError(error.message);return;}
    if(!data.session)setRegistroListo(true);
  };

  if(registroListo)return <div style={{minHeight:`calc(100vh - ${ALTO_HEADER}px)`,display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
    <div style={{background:"#fff",borderRadius:16,padding:28,width:"100%",maxWidth:380,boxShadow:"0 8px 30px rgba(0,0,0,.08)",textAlign:"center"}}>
      <div style={{fontSize:18,fontWeight:800,marginBottom:12,color:"#10284A"}}>¡Cuenta creada!</div>
      <div style={{fontSize:14,color:"#374151",lineHeight:1.6}}>Revisa tu correo para confirmar tu cuenta. Tu acceso quedará pendiente de aprobación hasta que lo revisemos.</div>
    </div>
  </div>;

  return <div style={{minHeight:`calc(100vh - ${ALTO_HEADER}px)`,display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
    <form onSubmit={modo==="entrar"?entrar:registrar} style={{background:"#fff",borderRadius:16,padding:28,width:"100%",maxWidth:380,boxShadow:"0 8px 30px rgba(0,0,0,.08)"}}>
      <div style={{fontSize:18,fontWeight:800,marginBottom:20,color:"#10284A"}}>{modo==="entrar"?"Iniciar sesión":"Registrar mi promotoría"}</div>

      {modo==="registro"&&<>
        <input value={nombreNegocio} onChange={e=>setNombreNegocio(e.target.value)} placeholder="nombre de tu promotoría" style={est.input}/>
        <input value={nombre} onChange={e=>setNombre(e.target.value)} placeholder="nombre de contacto (opcional)" style={est.input}/>
        <input value={rfc} onChange={e=>setRfc(e.target.value.toUpperCase())} placeholder="RFC (opcional)" style={est.input}/>
        <input value={codigoAgencia} onChange={e=>setCodigoAgencia(e.target.value.toUpperCase())} placeholder="Código de agencia máster (opcional)" style={est.input}/>
        <input value={codigoLibre} onChange={e=>setCodigoLibre(e.target.value.toUpperCase())} placeholder="¿Alguien te invitó? Su código (opcional)" style={est.input}/>
      </>}
      <input value={email} onChange={e=>setEmail(e.target.value)} placeholder="tu correo" type="email" autoComplete="username" style={est.input}/>
      <div style={{position:"relative"}}>
        <input value={password} onChange={e=>setPassword(e.target.value)} placeholder="tu contraseña" type={mostrarClave?"text":"password"} autoComplete={modo==="entrar"?"current-password":"new-password"} style={{...est.input,paddingRight:42,marginBottom:12}}/>
        <BotonVerClave mostrar={mostrarClave} onClick={()=>setMostrarClave(m=>!m)}/>
      </div>

      {modo==="registro"&&<label style={{display:"flex",alignItems:"flex-start",gap:8,fontSize:13,color:"#374151",marginBottom:12,cursor:"pointer"}}>
        <input type="checkbox" checked={aceptoTerminos} onChange={e=>setAceptoTerminos(e.target.checked)} style={{marginTop:2}}/>
        <span>Acepto los <a href="../terminos/" target="_blank" rel="noopener" style={{color:"#10284A"}}>Términos y Condiciones y el Aviso de Privacidad</a>.</span>
      </label>}

      {error&&<div style={{color:"#dc2626",fontSize:13,marginBottom:10}}>{error}</div>}
      <div style={{width:"100%"}}><Boton type="submit" disabled={cargando}>
        {cargando?(modo==="entrar"?"Entrando...":"Registrando..."):(modo==="entrar"?"Iniciar sesión":"Registrar mi promotoría")}
      </Boton></div>
      <button type="button" onClick={()=>{setModo(modo==="entrar"?"registro":"entrar");setError("");}} style={{...est.linkBtn,marginTop:12,padding:0}}>
        {modo==="entrar"?"¿Administras una red de agentes? Regístrate":"¿Ya tienes cuenta? Inicia sesión"}
      </button>
    </form>
  </div>;
}

function TarjetaKPI({label,valor,color,grande}){
  return <div style={{...est.card,textAlign:"center"}}>
    <div style={{fontSize:grande?30:22,fontWeight:700,color:color||"#10284A"}}>{valor}</div>
    <div style={{fontSize:12,color:"#8FA0B4",marginTop:4}}>{label}</div>
  </div>;
}

function CodigoInvitacion({codigo}){
  const[copiado,setCopiado]=useState(false);
  const copiar=async()=>{
    try{await navigator.clipboard.writeText(codigo);setCopiado(true);setTimeout(()=>setCopiado(false),2000);}
    catch(e){}
  };
  return <div style={{...est.card,marginBottom:24,background:"#F4F7FB"}}>
    <div style={{fontSize:13,fontWeight:700,color:"#8FA0B4",marginBottom:8}}>TU CÓDIGO DE INVITACIÓN</div>
    <div style={{fontSize:13,color:"#374151",marginBottom:10,lineHeight:1.5}}>
      Comparte este código con tus agentes — al registrarse en Upco InsurGest lo escriben en "Código de promotoría" y quedan ligados a tu red.
    </div>
    <div style={{display:"flex",alignItems:"center",gap:10}}>
      <div style={{background:"#fff",border:"1px solid #DDE4EE",borderRadius:10,padding:"10px 16px",fontSize:20,fontWeight:800,letterSpacing:2,color:"#10284A"}}>{codigo}</div>
      <Boton color="#53647D" onClick={copiar}>{copiado?"¡Copiado!":"Copiar"}</Boton>
    </div>
  </div>;
}

function BonoAnual(){
  const[residual,setResidual]=useState(null);
  const[acumulado,setAcumulado]=useState(null);
  const[pendiente,setPendiente]=useState(null);
  const[solicitando,setSolicitando]=useState(false);
  const[mensaje,setMensaje]=useState("");
  const[error,setError]=useState("");

  const cargar=()=>{
    sb.rpc("promotoria_mi_residual").then(({data})=>setResidual(data));
    sb.rpc("mi_residual_acumulado_anio").then(({data})=>setAcumulado(data));
    sb.rpc("mi_residual_pendiente").then(({data})=>setPendiente(data));
  };
  useEffect(()=>{cargar()},[]);

  const solicitar=async()=>{
    setError("");setMensaje("");setSolicitando(true);
    const{data,error:err}=await sb.rpc("solicitar_residual");
    setSolicitando(false);
    if(err){setError(err.message);return;}
    setMensaje(`Listo, solicitaste ${pesos(data.monto)}. Te avisamos en cuanto quede pagada.`);
    cargar();
  };

  if(!residual||!residual.tasa||residual.tasa<=0)return null;

  const hayPendiente=pendiente&&pendiente.pendiente_por_solicitar>0;

  return <div style={{...est.card,marginBottom:20,background:"linear-gradient(160deg,#173863,#0a1c35)"}}>
    <div style={{fontSize:13,fontWeight:700,color:"#F59E0B",marginBottom:6}}>🎁 TU COMISIÓN</div>
    <div style={{fontSize:12.5,color:"#C7D3E3",lineHeight:1.5,marginBottom:14}}>
      Ganas un {Math.round(residual.tasa*100)}% sobre lo que tus agentes adicionales le facturan a Upco cada mes. Se va acumulando mes a mes y la puedes solicitar cuando quieras.
    </div>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:hayPendiente?16:0}}>
      <div>
        <div style={{fontSize:22,fontWeight:700,color:"#fff"}}>{pesos(residual.residual_mensual)}</div>
        <div style={{fontSize:11,color:"#8FA0B4"}}>ESTE MES ({residual.agentes_que_cuentan} agentes adicionales)</div>
      </div>
      <div>
        <div style={{fontSize:22,fontWeight:700,color:"#fff"}}>{pesos(acumulado)}</div>
        <div style={{fontSize:11,color:"#8FA0B4"}}>ACUMULADO ESTE AÑO</div>
      </div>
    </div>
    {hayPendiente&&<div style={{borderTop:"1px solid rgba(255,255,255,.15)",paddingTop:14}}>
      <div style={{fontSize:13,color:"#C7D3E3",marginBottom:10}}>Tienes <b style={{color:"#fff"}}>{pesos(pendiente.pendiente_por_solicitar)}</b> sin solicitar.</div>
      {mensaje&&<div style={{color:"#86efac",fontSize:13,marginBottom:10}}>{mensaje}</div>}
      {error&&<div style={{color:"#fca5a5",fontSize:13,marginBottom:10}}>{error}</div>}
      <Boton color="#F59E0B" onClick={solicitar} disabled={solicitando||pendiente.solicitud_abierta}>
        {solicitando?"Enviando...":pendiente.solicitud_abierta?"Ya tienes una solicitud en proceso":"Solicitar mi comisión"}
      </Boton>
    </div>}
  </div>;
}

function Resumen({codigo}){
  const[r,setR]=useState(null);
  const[error,setError]=useState("");

  useEffect(()=>{
    sb.rpc("promotoria_resumen").then(({data,error})=>{
      if(error){setError(error.message);return;}
      setR(data);
    });
  },[]);

  return <div>
    <BonoAnual/>
    <CodigoInvitacion codigo={codigo}/>
    {error&&<div style={{color:"#dc2626",fontSize:13}}>{error}</div>}
    {!error&&!r&&<div style={{color:"#6B7280",fontSize:14}}>Cargando...</div>}
    {r&&<div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(140px,1fr))",gap:10}}>
      <TarjetaKPI label="Agentes en tu red" valor={r.agentes_totales} grande/>
      <TarjetaKPI label="Agentes confirmados" valor={r.agentes_aprobados} color="#16a34a"/>
      <TarjetaKPI label="Por confirmar" valor={r.agentes_red_pendiente} color="#F59E0B"/>
      <TarjetaKPI label="Clientes gestionados" valor={r.clientes_totales}/>
      <TarjetaKPI label="Pólizas gestionadas" valor={r.polizas_totales} grande/>
    </div>}
  </div>;
}

function Agentes(){
  const[agentes,setAgentes]=useState(null);
  const[error,setError]=useState("");
  const[filtro,setFiltro]=useState("pendiente");

  const cargar=async()=>{
    const{data,error}=await sb.rpc("promotoria_agentes");
    if(error){setError(error.message);return;}
    setAgentes(data||[]);
  };
  useEffect(()=>{cargar()},[]);

  const aprobar=async(a)=>{
    const{error}=await sb.rpc("promotoria_aprobar_agente",{p_agente_id:a.id});
    if(error){setError(error.message);return;}
    cargar();
  };
  const rechazar=async(a)=>{
    if(!window.confirm(`¿Sacar a ${a.correo} de tu red? Deja de contar para tu cuota de 5 agentes.`))return;
    const{error}=await sb.rpc("promotoria_rechazar_agente",{p_agente_id:a.id});
    if(error){setError(error.message);return;}
    cargar();
  };

  if(error)return <div style={{color:"#dc2626",fontSize:13}}>{error}</div>;
  if(!agentes)return <div style={{color:"#6B7280",fontSize:14}}>Cargando...</div>;

  const lista=filtro==="pendiente"?agentes.filter(a=>!a.red_aprobada_en):agentes;

  return <div>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
      <div style={{fontSize:16,fontWeight:700}}>Agentes de tu red {lista?`(${lista.length})`:""}</div>
      <div style={{display:"flex",gap:8}}>

        <button onClick={()=>setFiltro("todos")} style={{...est.linkBtn,fontWeight:filtro==="todos"?700:500,color:filtro==="todos"?"#10284A":"#8FA0B4"}}>Todos</button>

    </div>

      {lista.map(a=><div key={a.id} style={est.fila}>
        <div>

          <div style={{fontSize:12,color:"#8FA0B4",marginTop:2}}>
            {a.correo}{a.nombre_negocio?` · ${a.nombre_negocio}`:""}{a.telefono?` · ${a.telefono}`:""}
          </div>
          <div style={{fontSize:12,color:"#8FA0B4",marginTop:2}}>{a.clientes} clientes · {a.polizas} pólizas · {pesos(a.prima_total)} de prima vigente</div>
          {a.red_aprobada_en?<div style={{fontSize:12,marginTop:2,color:a.posicion<=5?"#16a34a":"#B45309"}}>
            {a.posicion<=5?`Incluido en tu cuota base (agente ${a.posicion} de 5)`:`Tarifa de agente adicional — $249/mes (posición ${a.posicion})`}
          </div>:<div style={{fontSize:12,marginTop:2,color:"#B45309"}}>Sin confirmar — no cuenta todavía para tu cuota</div>}
        </div>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          {!a.red_aprobada_en&&<button onClick={()=>aprobar(a)} style={{...est.linkBtn,color:"#16a34a"}}>Confirmar</button>}
          <button onClick={()=>rechazar(a)} style={{...est.linkBtn,color:"#dc2626"}}>Sacar de mi red</button>
        </div>
      </div>)}
    </div>}
  </div>;
}

function AvisosPromotoria({promotoriaId}){
  const[agentes,setAgentes]=useState(null);
  const[clientes,setClientes]=useState(null);
  const[selAgentes,setSelAgentes]=useState({});
  const[selClientes,setSelClientes]=useState({});
  const[asunto,setAsunto]=useState("");
  const[mensaje,setMensaje]=useState("");
  const[viaCorreo,setViaCorreo]=useState(true);
  const[viaPush,setViaPush]=useState(true);
  const[enviando,setEnviando]=useState(false);
  const[resultado,setResultado]=useState(null);
  const[error,setError]=useState("");
  const[disponibles,setDisponibles]=useState(null);
  const[imagen,setImagen]=useState(null);
  const[subiendoImagen,setSubiendoImagen]=useState(false);

  const cargarDisponibles=()=>{sb.rpc("avisos_disponibles_hoy").then(({data})=>setDisponibles(data));};

  const elegirImagen=(archivo)=>{
    setError("");
    if(!archivo){setImagen(null);return;}
    if(archivo.size>5*1024*1024){setError("La imagen no puede pesar más de 5 MB.");return;}
    setImagen(archivo);
  };

  useEffect(()=>{
    sb.rpc("promotoria_agentes").then(({data,error})=>{if(error){setError(error.message);return;}setAgentes(data||[]);});
    sb.rpc("promotoria_clientes").then(({data,error})=>{if(error){setError(error.message);return;}setClientes(data||[]);});
    cargarDisponibles();
  },[]);

  const toggleAgente=(id)=>setSelAgentes(prev=>({...prev,[id]:!prev[id]}));
  const toggleCliente=(id)=>setSelClientes(prev=>({...prev,[id]:!prev[id]}));

  const enviar=async(e)=>{
    e.preventDefault();
    const agenteIds=Object.keys(selAgentes).filter(id=>selAgentes[id]);
    const clienteIds=Object.keys(selClientes).filter(id=>selClientes[id]);
    if(agenteIds.length===0&&clienteIds.length===0){setError("Selecciona al menos un destinatario.");return;}
    if(!asunto.trim()||!mensaje.trim()){setError("Escribe un asunto y un mensaje.");return;}
    setError("");setEnviando(true);setResultado(null);

    let imagenUrl=null;
    if(imagen){
      setSubiendoImagen(true);
      const ruta=`${promotoriaId}/${Date.now()}-${imagen.name}`;
      const{error:errSubida}=await sb.storage.from("avisos-adjuntos").upload(ruta,imagen,{contentType:imagen.type});
      setSubiendoImagen(false);
      if(errSubida){setEnviando(false);setError("No se pudo subir la imagen: "+errSubida.message);return;}
      const{data:pub}=sb.storage.from("avisos-adjuntos").getPublicUrl(ruta);
      imagenUrl=pub.publicUrl;
    }

    const{data,error:errRpc}=await sb.rpc("promotoria_notificar",{
      p_agente_ids:agenteIds,p_cliente_ids:clienteIds,p_asunto:asunto.trim(),p_mensaje:mensaje.trim(),
      p_via_correo:viaCorreo,p_via_push:viaPush,p_imagen_url:imagenUrl
    });
    setEnviando(false);
    if(errRpc){setError(errRpc.message);return;}
    setResultado(data);setAsunto("");setMensaje("");setSelAgentes({});setSelClientes({});setImagen(null);
    cargarDisponibles();
  };

  if(!agentes||!clientes)return <div style={{color:"#6B7280",fontSize:14}}>Cargando...</div>;
  const totalSel=Object.values(selAgentes).filter(Boolean).length+Object.values(selClientes).filter(Boolean).length;
  const sinEnvios=disponibles===0;

  return <div>
    <div style={{fontSize:16,fontWeight:700,marginBottom:6}}>Avisos a tu red</div>
    <div style={{fontSize:13,color:"#8FA0B4",marginBottom:6}}>Manda un correo y/o notificación push a los agentes de tu red, o directo a sus clientes.</div>
    {disponibles!=null&&<div style={{fontSize:12,fontWeight:700,color:sinEnvios?"#dc2626":"#8FA0B4",marginBottom:16}}>
      {sinEnvios?"Llegaste al límite de envíos masivos de hoy — vuelve a intentarlo más tarde.":`Te quedan ${disponibles} envíos masivos hoy.`}
    </div>}

    <form onSubmit={enviar} style={est.card}>
      <label style={est.label}>Agentes de tu red</label>
      <div style={{maxHeight:150,overflowY:"auto",border:"1px solid #DDE4EE",borderRadius:10,padding:"6px 12px",marginBottom:14}}>
        {agentes.length===0&&<div style={{fontSize:13,color:"#8FA0B4",padding:"8px 0"}}>Todavía no tienes agentes en tu red.</div>}
        {agentes.map(a=><label key={a.id} style={{display:"flex",alignItems:"center",gap:8,padding:"6px 0",fontSize:13,color:"#374151",cursor:"pointer"}}>
          <input type="checkbox" checked={!!selAgentes[a.id]} onChange={()=>toggleAgente(a.id)}/>
          {a.nombre||a.correo}
        </label>)}
      </div>

      <label style={est.label}>Clientes directos de tus agentes</label>
      <div style={{maxHeight:150,overflowY:"auto",border:"1px solid #DDE4EE",borderRadius:10,padding:"6px 12px",marginBottom:14}}>
        {clientes.length===0&&<div style={{fontSize:13,color:"#8FA0B4",padding:"8px 0"}}>Todavía no hay clientes en tu red.</div>}
        {clientes.map(c=><label key={c.id} style={{display:"flex",alignItems:"center",gap:8,padding:"6px 0",fontSize:13,color:c.correo?"#374151":"#C4CDD9",cursor:c.correo?"pointer":"not-allowed"}}>
          <input type="checkbox" checked={!!selClientes[c.id]} disabled={!c.correo} onChange={()=>toggleCliente(c.id)}/>
          {c.nombre} <span style={{color:"#8FA0B4"}}>— {c.agente_nombre}</span>{!c.correo&&" (sin correo)"}
        </label>)}
      </div>

      <div style={{fontSize:12,color:"#8FA0B4",marginBottom:10}}>{totalSel} destinatarios seleccionados</div>

      <input value={asunto} onChange={e=>setAsunto(e.target.value)} placeholder="Asunto" style={est.input}/>
      <textarea value={mensaje} onChange={e=>setMensaje(e.target.value)} placeholder="Mensaje" rows={4} style={est.input}/>
      <div style={{fontSize:11.5,color:"#8FA0B4",marginTop:-8,marginBottom:14}}>
        Igual que en WhatsApp: escribe *así* para <b>negritas</b> y _así_ para <i>cursiva</i>. Solo aplica en el correo, no en el push.
      </div>

      <label style={est.label}>Imagen (opcional — un arte de tu aseguradora, un póster de Canva...)</label>
      <input type="file" accept="image/*" onChange={e=>elegirImagen(e.target.files[0]||null)} style={{fontSize:14,marginBottom:4}}/>
      <div style={{fontSize:11.5,color:"#8FA0B4",marginBottom:14}}>Solo se ve en el correo — el push cuando mucho muestra un ícono pequeño, no la imagen completa. Máximo 5 MB.</div>
      {imagen&&<div style={{marginBottom:14}}>
        <img src={URL.createObjectURL(imagen)} alt="" style={{maxWidth:200,borderRadius:8,display:"block",marginBottom:6}}/>
        <button type="button" onClick={()=>setImagen(null)} style={est.linkBtn}>Quitar imagen</button>
      </div>}

      <div style={{display:"flex",gap:16,marginBottom:14}}>
        <label style={{display:"flex",alignItems:"center",gap:6,fontSize:13,color:"#374151",cursor:"pointer"}}>
          <input type="checkbox" checked={viaCorreo} onChange={e=>setViaCorreo(e.target.checked)}/> Por correo
        </label>
        <label style={{display:"flex",alignItems:"center",gap:6,fontSize:13,color:"#374151",cursor:"pointer"}}>
          <input type="checkbox" checked={viaPush} onChange={e=>setViaPush(e.target.checked)}/> Por notificación push
        </label>
      </div>

      {error&&<div style={{color:"#dc2626",fontSize:13,marginBottom:10}}>{error}</div>}
      {resultado&&<div style={{color:"#16a34a",fontSize:13,marginBottom:10}}>Enviado: {resultado.correos_enviados} correos, {resultado.push_disparados} avisos push.</div>}
      <Boton type="submit" disabled={enviando||sinEnvios||(!viaCorreo&&!viaPush)}>{subiendoImagen?"Subiendo imagen...":enviando?"Enviando...":"Enviar aviso"}</Boton>
    </form>
  </div>;
}

const PLANES_PROMOTORIA=[
  {periodo:"mensual",label:"Mensual",monto:"$999 MXN/mes"},
  {periodo:"trimestral",label:"Trimestral",monto:"$2,890 MXN cada 3 meses"},
  {periodo:"semestral",label:"Semestral",monto:"$5,570 MXN cada 6 meses"},
  {periodo:"anual",label:"Anual",monto:"$9,990 MXN/año"}
];

function PantallaSuscripcionPromotoria({cuenta,bloqueado}){
  const[cargando,setCargando]=useState(null);
  const[error,setError]=useState("");

  const suscribirse=async(periodo)=>{
    setError("");setCargando(periodo);
    const{data,error:errFn}=await sb.functions.invoke("create-checkout-session",{body:{tipo:"promotoria_base",periodo}});
    setCargando(null);
    if(errFn||!data?.url){
      let detalle=(data&&data.error)||"";
      // supabase-js guarda la respuesta HTTP real en errFn.context — de ahí sacamos el motivo.
      if(!detalle&&errFn&&errFn.context&&typeof errFn.context.json==="function"){
        try{const cuerpo=await errFn.context.json();detalle=cuerpo&&cuerpo.error;}catch(e){}
      }
      setError(detalle?`No se pudo iniciar el pago: ${detalle}`:"No se pudo iniciar el pago. Intenta de nuevo.");
      return;
    }
    window.location.href=data.url;
  };

  // Manda al Portal de Cliente de Stripe: ahí cancela, cambia tarjeta y baja sus facturas.
  const administrar=async()=>{
    setError("");setCargando("portal");
    const{data,error:errFn}=await sb.functions.invoke("create-portal-session",{body:{tipo:"promotoria_base"}});
    setCargando(null);
    if(errFn||!data?.url){
      let detalle=(data&&data.error)||"";
      if(!detalle&&errFn&&errFn.context&&typeof errFn.context.json==="function"){
        try{const cuerpo=await errFn.context.json();detalle=cuerpo&&cuerpo.error;}catch(e){}
      }
      setError(detalle?`No se pudo abrir tu suscripción: ${detalle}`:"No se pudo abrir tu suscripción. Intenta de nuevo.");
      return;
    }
    window.location.href=data.url;
  };

  const suscripcionActiva=cuenta.estatus_suscripcion==="active"||cuenta.estatus_suscripcion==="trialing";
  const ahora=new Date();
  const finPrueba=cuenta.aprobado_en?new Date(new Date(cuenta.aprobado_en).getTime()+30*86400000):null;
  const accesoExtendido=cuenta.acceso_extendido_hasta?new Date(cuenta.acceso_extendido_hasta):null;
  const diasPrueba=finPrueba?Math.ceil((finPrueba-ahora)/86400000):null;
  const diasExtendido=accesoExtendido?Math.ceil((accesoExtendido-ahora)/86400000):null;

  const contenido=<div style={{width:"100%",maxWidth:520}}>
    {bloqueado&&<div style={{textAlign:"center",marginBottom:20}}>
      <div style={{fontSize:18,fontWeight:800,color:"#10284A",marginBottom:8}}>Tu prueba gratuita terminó</div>
      <div style={{fontSize:14,color:"#374151"}}>Elige un plan para seguir usando tu portal de promotoría.</div>
    </div>}
    {!bloqueado&&<div style={{marginBottom:16}}>
      <div style={{fontSize:16,fontWeight:700,marginBottom:4}}>Mi suscripción</div>
      {suscripcionActiva&&<div style={{fontSize:13,color:"#16a34a"}}>Plan activo: {cuenta.plan_periodo||"—"} · estatus {cuenta.estatus_suscripcion}</div>}
      {!suscripcionActiva&&diasExtendido>0&&<div style={{fontSize:13,color:"#F59E0B"}}>Acceso extendido — quedan {diasExtendido} días</div>}
      {!suscripcionActiva&&!(diasExtendido>0)&&diasPrueba!=null&&<div style={{fontSize:13,color:diasPrueba<=5?"#F59E0B":"#8FA0B4"}}>Prueba gratuita — quedan {Math.max(diasPrueba,0)} días</div>}
    </div>}

    {!suscripcionActiva&&<div style={{fontSize:12,color:"#8FA0B4",marginBottom:10}}>Cuota base — incluye 5 agentes en tu red.</div>}
    {!suscripcionActiva&&<div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(150px,1fr))",gap:10}}>
      {PLANES_PROMOTORIA.map(p=><div key={p.periodo} style={est.card}>
        <div style={{fontSize:11,fontWeight:700,color:"#8FA0B4",marginBottom:4}}>{p.label.toUpperCase()}</div>
        <div style={{fontSize:14,fontWeight:700,color:"#10284A",marginBottom:12}}>{p.monto}</div>
        <Boton onClick={()=>suscribirse(p.periodo)} disabled={cargando!==null}>{cargando===p.periodo?"Redirigiendo...":"Elegir"}</Boton>
      </div>)}
    </div>}

    {suscripcionActiva&&<div style={est.card}>
      <div style={{fontSize:13,color:"#374151",marginBottom:12}}>Desde Stripe puedes cambiar tu tarjeta, descargar tus facturas o cancelar tu suscripción.</div>
      <Boton onClick={administrar} disabled={cargando!==null}>{cargando==="portal"?"Abriendo...":"Administrar mi suscripción"}</Boton>
    </div>}

    {error&&<div style={{color:"#dc2626",fontSize:13,marginTop:14,textAlign:"center"}}>{error}</div>}
    {!suscripcionActiva&&<div style={{fontSize:11,color:"#8FA0B4",marginTop:14,textAlign:"center"}}>Agentes adicionales a los 5 incluidos se facturan aparte por ahora — escríbenos. Se cobra por Stripe, cancela cuando quieras.</div>}
  </div>;

  if(!bloqueado)return contenido;
  return <div style={{minHeight:`calc(100vh - ${ALTO_HEADER}px)`,display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>{contenido}</div>;
}

// ============ CARTERA PROPIA DE LA PROMOTORÍA (clientes/vehículos/pólizas) ============
// Fase 2 del roadmap acordado (import -> cartera propia de promotoría -> siniestros): algunas
// pólizas se emiten con la clave de la PROMOTORÍA ante la aseguradora, no la del agente, aunque
// el agente sea quien atiende al cliente — por eso la promotoría necesita poder dar de alta y
// administrar sus propios clientes, igual que ya puede un agente en /app. Son básicamente los
// mismos componentes de /app, adaptados: agente_id -> promotoria_id, y los RPCs específicos de
// agente tienen su equivalente de promotoría (agente_X -> promotoria_X) construidos en la Sesión 43.

function ClienteForm({promotoriaId,clienteExistente,onGuardado,onCancelar}){
  const c=clienteExistente;
  const[tipoPersona,setTipoPersona]=useState(c?c.tipo_persona:"fisica");
  const[nombre,setNombre]=useState(c?c.nombre:"");
  const[rfc,setRfc]=useState(c?c.rfc||"":"");
  const[curp,setCurp]=useState(c?c.curp||"":"");
  const[fechaNacimiento,setFechaNacimiento]=useState(c?c.fecha_nacimiento||"":"");
  const[correo,setCorreo]=useState(c?c.correo||"":"");
  const[telefono,setTelefono]=useState(c?c.telefono||"":"");
  const[notas,setNotas]=useState(c?c.notas||"":"");
  const[guardando,setGuardando]=useState(false);
  const[error,setError]=useState("");

  const guardar=async(e)=>{
    e.preventDefault();
    if(!nombre.trim()){setError("El nombre es obligatorio.");return;}
    setError("");setGuardando(true);
    const payload={
      tipo_persona:tipoPersona,
      nombre:nombre.trim(),
      rfc:rfc.trim()||null,
      curp:tipoPersona==="fisica"?(curp.trim()||null):null,
      fecha_nacimiento:tipoPersona==="fisica"?(fechaNacimiento||null):null,
      correo:correo.trim()||null,
      telefono:telefono.trim()||null,
      notas:notas.trim()||null,
    };
    let resultado;
    if(c){
      resultado=await sb.from("clientes").update(payload).eq("id",c.id).select().single();
    }else{
      resultado=await sb.from("clientes").insert({...payload,promotoria_id:promotoriaId}).select().single();
    }
    setGuardando(false);
    if(resultado.error){setError(resultado.error.message);return;}
    onGuardado(resultado.data);
  };

  return <form onSubmit={guardar} style={{...est.card,marginBottom:24}}>
    <div style={{fontSize:16,fontWeight:700,marginBottom:16}}>{c?"Editar cliente":"Nuevo cliente"}</div>

    <Campo label="Tipo de persona">
      <select name="tipo_persona" value={tipoPersona} onChange={e=>setTipoPersona(e.target.value)} style={est.input}>
        <option value="fisica">Persona física</option>
        <option value="moral">Persona moral</option>
      </select>
    </Campo>

    <Campo label={tipoPersona==="moral"?"Razón social":"Nombre completo"}>
      <input name="nombre" value={nombre} onChange={e=>setNombre(e.target.value)} style={est.input}/>
    </Campo>

    <div style={{display:"grid",gridTemplateColumns:tipoPersona==="fisica"?"1fr 1fr":"1fr",gap:10}}>
      <Campo label="RFC">
        <input name="rfc" value={rfc} onChange={e=>setRfc(e.target.value.toUpperCase())} style={est.input}/>
      </Campo>
      {tipoPersona==="fisica"&&<Campo label="CURP">
        <input name="curp" value={curp} onChange={e=>setCurp(e.target.value.toUpperCase())} style={est.input}/>
      </Campo>}
    </div>

    {tipoPersona==="fisica"&&<Campo label="Fecha de nacimiento (para saludarlo en su cumpleaños)">
      <input name="fecha_nacimiento" type="date" value={fechaNacimiento} onChange={e=>setFechaNacimiento(e.target.value)} style={est.input}/>
    </Campo>}

    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
      <Campo label="Correo electrónico">
        <input name="correo" value={correo} onChange={e=>setCorreo(e.target.value)} type="email" style={est.input}/>
      </Campo>
      <Campo label="Teléfono">
        <input name="telefono" value={telefono} onChange={e=>setTelefono(e.target.value)} style={est.input}/>
      </Campo>
    </div>

    <Campo label="Notas">
      <textarea name="notas" value={notas} onChange={e=>setNotas(e.target.value)} rows={2} style={est.input}/>
    </Campo>

    {error&&<div style={{color:"#dc2626",fontSize:13,marginBottom:10}}>{error}</div>}
    <div style={{display:"flex",gap:10}}>
      <Boton type="submit" disabled={guardando}>{guardando?"Guardando...":"Guardar"}</Boton>
      <button type="button" onClick={onCancelar} style={est.linkBtn}>Cancelar</button>
    </div>
  </form>;
}

function ProximosCumpleanos({onAbrirCliente,clientes}){
  const[lista,setLista]=useState(null);

  useEffect(()=>{
    sb.rpc("promotoria_cumpleanos_proximos",{p_dias:14}).then(({data,error})=>{
      if(error)return;
      setLista(data||[]);
    });
  },[]);

  if(!lista||lista.length===0)return null;

  const textoDia=(d)=>d===0?"Hoy":d===1?"Mañana":`En ${d} días`;

  return <div style={{...est.card,border:"1.5px solid #FBBF24",marginBottom:16}}>
    <div style={{fontSize:14,fontWeight:700,marginBottom:10}}>🎂 Próximos cumpleaños</div>
    {lista.map(l=>{
      const cliente=(clientes||[]).find(c=>c.id===l.id);
      const wa=l.telefono?l.telefono.replace(/\D/g,""):null;
      return <div key={l.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"7px 0",borderBottom:"1px solid #F1F5F9"}}>
        <div style={{fontSize:13,cursor:cliente?"pointer":"default"}} onClick={()=>cliente&&onAbrirCliente(cliente)}>
          <b>{l.nombre}</b> <span style={{color:l.dias_para_cumple===0?"#B45309":"#8FA0B4"}}>— {textoDia(l.dias_para_cumple)}</span>
        </div>
        {wa&&<a href={`https://wa.me/52${wa}?text=${encodeURIComponent(`¡Feliz cumpleaños, ${l.nombre.split(" ")[0]}! 🎉 Que tengas un excelente día.`)}`} target="_blank" rel="noopener" style={{fontSize:12,fontWeight:700,color:"#16a34a"}} onClick={e=>e.stopPropagation()}>Felicitar por WhatsApp</a>}
      </div>;
    })}
  </div>;
}

// Convierte clientes+pólizas a un CSV (Excel lo abre nativo, con acentos correctos gracias al
// BOM) — una fila por póliza, y una fila con las columnas de póliza vacías si el cliente no
// tiene ninguna, para que la cartera completa quede reflejada aunque sea recién dado de alta.
function descargarClientesCSV(clientes,polizasPorCliente){
  const encabezados=["Cliente","Tipo de persona","RFC","CURP","Correo","Teléfono","Aseguradora","Ramo","Número de póliza","Prima","Forma de pago","Inicio de vigencia","Fin de vigencia","Estatus"];
  const filas=[];
  (clientes||[]).forEach(c=>{
    const propias=polizasPorCliente[c.id]||[];
    const base=[c.nombre,c.tipo_persona==="moral"?"Persona moral":"Persona física",c.rfc||"",c.curp||"",c.correo||"",c.telefono||""];
    if(propias.length===0){
      filas.push([...base,"","","","","","","",""]);
    }else{
      propias.forEach(p=>filas.push([...base,p.aseguradora||"",p.ramo||"",p.numero_poliza||"",p.prima??"",p.forma_pago||"",p.fecha_inicio||"",p.fecha_fin||"",p.estatus||""]));
    }
  });
  const escapar=v=>{
    const t=String(v??"");
    return /[",\n]/.test(t)?'"'+t.replace(/"/g,'""')+'"':t;
  };
  const csv=[encabezados,...filas].map(fila=>fila.map(escapar).join(",")).join("\r\n");
  const blob=new Blob(["﻿"+csv],{type:"text/csv;charset=utf-8;"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download=`clientes-polizas-promotoria-${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// ============ IMPORTAR CLIENTES DESDE CSV ============
const COLUMNAS_IMPORT=["nombre","tipo_persona","rfc","curp","correo","telefono","notas"];
const ALIAS_COLUMNA={
  nombre:["nombre","cliente","nombre completo","nombre del cliente"],
  tipo_persona:["tipo_persona","tipo de persona","persona"],
  rfc:["rfc"],
  curp:["curp"],
  correo:["correo","correo electronico","email"],
  telefono:["telefono","celular","tel"],
  notas:["notas","nota","comentarios"]
};

function normalizarEncabezado(h){
  return (h||"").toString().trim().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
}

function mapearColumnasImport(encabezados){
  const normalizados=encabezados.map(normalizarEncabezado);
  const mapa={};
  COLUMNAS_IMPORT.forEach(campo=>{
    const variantes=ALIAS_COLUMNA[campo].map(normalizarEncabezado);
    const idx=normalizados.findIndex(h=>variantes.includes(h));
    if(idx>-1)mapa[campo]=encabezados[idx];
  });
  return mapa;
}

function descargarPlantillaCSV(){
  const encabezados=["nombre","tipo_persona","rfc","curp","correo","telefono","notas"];
  const ejemplo=["Juan Pérez López","fisica","PELJ800101ABC","PELJ800101HDFXXX01","juan@example.com","5512345678",""];
  const csv=[encabezados,ejemplo].map(fila=>fila.join(",")).join("\r\n");
  const blob=new Blob(["﻿"+csv],{type:"text/csv;charset=utf-8;"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;a.download="plantilla-clientes.csv";
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function ImportarClientes({onCerrar,onImportado}){
  const[filas,setFilas]=useState(null);
  const[mapa,setMapa]=useState(null);
  const[error,setError]=useState("");
  const[importando,setImportando]=useState(false);
  const[resultado,setResultado]=useState(null);

  const elegirArchivo=(file)=>{
    setError("");setFilas(null);setResultado(null);
    if(!file)return;
    Papa.parse(file,{
      header:true,skipEmptyLines:true,
      complete:(res)=>{
        if(!res.data.length){setError("El archivo no tiene filas.");return;}
        const encabezados=res.meta.fields||[];
        const m=mapearColumnasImport(encabezados);
        if(!m.nombre){setError('No encontramos una columna de "nombre" en tu archivo. Descarga la plantilla para asegurarte de que las columnas coincidan.');return;}
        setMapa(m);
        const datos=res.data.map(fila=>{
          const obj={};
          COLUMNAS_IMPORT.forEach(campo=>{ if(m[campo])obj[campo]=fila[m[campo]]; });
          return obj;
        }).filter(f=>Object.values(f).some(v=>v&&String(v).trim()));
        if(datos.length>1000){setError(`Tu archivo tiene ${datos.length} filas — el máximo por importación es 1000. Divídelo en partes más chicas.`);return;}
        setFilas(datos);
      },
      error:(err)=>setError("No se pudo leer el archivo: "+err.message)
    });
  };

  const importar=async()=>{
    if(!filas||!filas.length)return;
    setImportando(true);setError("");
    const{data,error:err}=await sb.rpc("promotoria_importar_clientes",{p_filas:filas});
    setImportando(false);
    if(err){setError(err.message);return;}
    setResultado(data);
    if(data.insertados>0)onImportado();
  };

  return <div style={{...est.card,maxWidth:560,marginBottom:16}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
      <div style={{fontSize:16,fontWeight:700}}>Importar clientes desde CSV</div>
      <button onClick={onCerrar} style={est.linkBtn}>Cerrar</button>
    </div>
    <div style={{fontSize:13,color:"#6B7280",marginBottom:14}}>
      Por ahora solo importa clientes (sin pólizas). <button type="button" onClick={descargarPlantillaCSV} style={{...est.linkBtn,padding:0,textDecoration:"underline"}}>Descargar plantilla</button> para asegurarte de que las columnas coincidan.
    </div>

    {!resultado&&<>
      <input type="file" accept=".csv" name="archivo_csv" onChange={e=>elegirArchivo(e.target.files[0])} style={{marginBottom:14}}/>
      {error&&<div style={{color:"#dc2626",fontSize:13,marginBottom:10}}>{error}</div>}

      {filas&&filas.length>0&&<div>
        <div style={{fontSize:13,color:"#374151",marginBottom:10}}>
          Encontramos <b>{filas.length}</b> cliente(s) listos para revisar. Columnas detectadas: {COLUMNAS_IMPORT.filter(c=>mapa[c]).join(", ")}.
        </div>
        <div style={{...est.card,maxHeight:220,overflowY:"auto",padding:0,marginBottom:14}}>
          {filas.slice(0,8).map((f,i)=><div key={i} style={{...est.fila,cursor:"default"}}>
            <div>
              <div style={{fontWeight:700,fontSize:13}}>{f.nombre||"(sin nombre)"}</div>
              <div style={{fontSize:11,color:"#8FA0B4"}}>{[f.rfc,f.correo,f.telefono].filter(Boolean).join(" · ")||"—"}</div>
            </div>
          </div>)}
          {filas.length>8&&<div style={{padding:"10px 16px",fontSize:12,color:"#8FA0B4"}}>y {filas.length-8} más…</div>}
        </div>
        <Boton onClick={importar} disabled={importando}>{importando?"Importando...":`Importar ${filas.length} cliente(s)`}</Boton>
      </div>}
    </>}

    {resultado&&<div>
      <div style={{color:"#16a34a",fontSize:14,fontWeight:700,marginBottom:8}}>{resultado.insertados} cliente(s) importado(s) correctamente.</div>
      {resultado.omitidos.length>0&&<div style={{marginTop:10}}>
        <div style={{fontSize:13,fontWeight:700,color:"#B45309",marginBottom:6}}>{resultado.omitidos.length} fila(s) omitida(s):</div>
        <div style={{...est.card,maxHeight:180,overflowY:"auto",padding:"10px 14px"}}>
          {resultado.omitidos.map((o,i)=><div key={i} style={{fontSize:12.5,color:"#374151",marginBottom:4}}>Fila {o.fila}{o.nombre?` (${o.nombre})`:""}: {o.motivo}</div>)}
        </div>
      </div>}
      <div style={{marginTop:14}}><Boton onClick={onCerrar}>Listo</Boton></div>
    </div>}
  </div>;
}

function ClientesList({promotoriaId,onAbrirCliente}){
  const[clientes,setClientes]=useState(null);
  const[polizas,setPolizas]=useState([]);
  const[busqueda,setBusqueda]=useState("");
  const[formAbierto,setFormAbierto]=useState(false);
  const[formPolizaAbierto,setFormPolizaAbierto]=useState(false);
  const[importarAbierto,setImportarAbierto]=useState(false);
  const[error,setError]=useState("");

  const cargar=async()=>{
    const[resCl,resPz]=await Promise.all([
      sb.from("clientes").select("*").eq("promotoria_id",promotoriaId).order("nombre"),
      sb.from("polizas").select("*") // RLS ya limita a las pólizas de esta promotoría
    ]);
    if(resCl.error){setError(resCl.error.message);return;}
    if(resPz.error){setError(resPz.error.message);return;}
    setClientes(resCl.data);
    setPolizas(resPz.data||[]);
  };
  useEffect(()=>{cargar()},[]);

  const polizasPorCliente={};
  polizas.forEach(p=>{(polizasPorCliente[p.cliente_id]=polizasPorCliente[p.cliente_id]||[]).push(p);});

  const texto=busqueda.trim().toLowerCase();
  const clientesFiltrados=!clientes?null:!texto?clientes:clientes.filter(c=>{
    const propias=polizasPorCliente[c.id]||[];
    const enCliente=[c.nombre,c.correo,c.telefono,c.rfc,c.curp].some(v=>v&&v.toLowerCase().includes(texto));
    const enPolizas=propias.some(p=>[p.aseguradora,p.numero_poliza,p.ramo].some(v=>v&&String(v).toLowerCase().includes(texto)));
    return enCliente||enPolizas;
  });

  return <div>
    {!formAbierto&&!formPolizaAbierto&&!importarAbierto&&<ProximosCumpleanos clientes={clientes} onAbrirCliente={onAbrirCliente}/>}
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16,flexWrap:"wrap",gap:8}}>
      <div style={{fontSize:16,fontWeight:700}}>Mis clientes {clientesFiltrados?`(${clientesFiltrados.length})`:""}</div>
      {!formAbierto&&!formPolizaAbierto&&!importarAbierto&&<div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
        {clientes&&clientes.length>0&&<Boton color="#53647D" onClick={()=>descargarClientesCSV(clientes,polizasPorCliente)}>Exportar a Excel</Boton>}
        <Boton color="#53647D" onClick={()=>setImportarAbierto(true)}>Importar CSV</Boton>
        {clientes&&clientes.length>0&&<Boton color="#F59E0B" onClick={()=>setFormPolizaAbierto(true)}>+ Nueva póliza</Boton>}
        <Boton onClick={()=>setFormAbierto(true)}>+ Nuevo cliente</Boton>
      </div>}
    </div>

    {!formAbierto&&!formPolizaAbierto&&!importarAbierto&&clientes&&clientes.length>0&&
      <input placeholder="Buscar por cliente, correo, teléfono, RFC, aseguradora o número de póliza..."
        value={busqueda} onChange={e=>setBusqueda(e.target.value)} style={est.input}/>}

    {formAbierto&&<ClienteForm promotoriaId={promotoriaId}
      onGuardado={()=>{setFormAbierto(false);cargar();}}
      onCancelar={()=>setFormAbierto(false)}/>}

    {formPolizaAbierto&&<PolizaForm promotoriaId={promotoriaId} clientesDisponibles={clientes}
      onGuardado={(poliza)=>{
        setFormPolizaAbierto(false);
        const cliente=(clientes||[]).find(c=>c.id===poliza.cliente_id);
        if(cliente)onAbrirCliente(cliente);
      }}
      onCancelar={()=>setFormPolizaAbierto(false)}/>}

    {importarAbierto&&<ImportarClientes onCerrar={()=>{setImportarAbierto(false);cargar();}} onImportado={cargar}/>}

    {error&&<div style={{color:"#dc2626",fontSize:13,marginBottom:10}}>{error}</div>}
    {!importarAbierto&&!clientes&&<div style={{color:"#6B7280",fontSize:14}}>Cargando...</div>}
    {!importarAbierto&&clientes&&clientes.length===0&&!formAbierto&&<div style={{...est.card,textAlign:"center",color:"#6B7280"}}>
      Todavía no tienes clientes propios registrados.
    </div>}
    {!importarAbierto&&clientesFiltrados&&clientesFiltrados.length===0&&clientes.length>0&&<div style={{...est.card,textAlign:"center",color:"#6B7280"}}>
      Ningún cliente o póliza coincide con "{busqueda}".
    </div>}
    {!importarAbierto&&clientesFiltrados&&clientesFiltrados.length>0&&<div style={{...est.card,padding:0,overflow:"hidden"}}>
      {clientesFiltrados.map(c=><div key={c.id} style={est.fila} onClick={()=>onAbrirCliente(c)}>
        <div>
          <div style={{fontWeight:700,fontSize:14}}>{c.nombre}</div>
          <div style={{fontSize:12,color:"#8FA0B4"}}>{c.tipo_persona==="moral"?"Persona moral":"Persona física"}{c.correo?` · ${c.correo}`:""}</div>
        </div>
        <div style={{color:"#8FA0B4",fontSize:18}}>›</div>
      </div>)}
    </div>}
  </div>;
}

function VehiculoForm({clienteId,vehiculoExistente,onGuardado,onCancelar}){
  const v=vehiculoExistente;
  const[placas,setPlacas]=useState(v?v.placas||"":"");
  const[estado,setEstado]=useState(v?v.estado||"":"");
  const[marca,setMarca]=useState(v?v.marca||"":"");
  const[modelo,setModelo]=useState(v?v.modelo||"":"");
  const[anio,setAnio]=useState(v&&v.anio!=null?String(v.anio):"");
  const[tipoVehiculo,setTipoVehiculo]=useState(v?v.tipo_vehiculo:"familiar");
  const[tipoCarga,setTipoCarga]=useState(v?v.tipo_carga||"A":"A");
  const[fechaVerificacion,setFechaVerificacion]=useState(v?v.fecha_verificacion||"":"");
  const[guardando,setGuardando]=useState(false);
  const[error,setError]=useState("");

  const guardar=async(e)=>{
    e.preventDefault();
    setError("");setGuardando(true);
    const payload={
      placas:placas.trim()||null,
      estado:estado||null,
      marca:marca.trim()||null,
      modelo:modelo.trim()||null,
      anio:anio?parseInt(anio,10):null,
      tipo_vehiculo:tipoVehiculo,
      tipo_carga:tipoVehiculo==="carga"?tipoCarga:null,
      fecha_verificacion:fechaVerificacion||null,
    };
    let resultado;
    if(v){
      resultado=await sb.from("vehiculos").update(payload).eq("id",v.id).select().single();
    }else{
      resultado=await sb.from("vehiculos").insert({...payload,cliente_id:clienteId}).select().single();
    }
    setGuardando(false);
    if(resultado.error){setError(resultado.error.message);return;}
    onGuardado(resultado.data);
  };

  return <form onSubmit={guardar} style={{...est.card,marginBottom:24}}>
    <div style={{fontSize:16,fontWeight:700,marginBottom:16}}>{v?"Editar vehículo":"Nuevo vehículo"}</div>

    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
      <Campo label="Placas">
        <input name="placas" value={placas} onChange={e=>setPlacas(e.target.value.toUpperCase())} style={est.input}/>
      </Campo>
      <Campo label="Estado (placas)">
        <select name="estado" value={estado} onChange={e=>setEstado(e.target.value)} style={est.input}>
          <option value="">— Selecciona —</option>
          {ESTADOS_MX.map(e=><option key={e} value={e}>{e}</option>)}
        </select>
      </Campo>
    </div>

    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
      <Campo label="Marca">
        <input name="marca" value={marca} onChange={e=>setMarca(e.target.value)} style={est.input}/>
      </Campo>
      <Campo label="Modelo">
        <input name="modelo" value={modelo} onChange={e=>setModelo(e.target.value)} style={est.input}/>
      </Campo>
    </div>

    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
      <Campo label="Año">
        <input name="anio" value={anio} onChange={e=>setAnio(e.target.value)} type="number" min="1980" max="2100" style={est.input}/>
      </Campo>
      <Campo label="Fecha de verificación vehicular">
        <input name="fecha_verificacion" value={fechaVerificacion} onChange={e=>setFechaVerificacion(e.target.value)} type="date" style={est.input}/>
      </Campo>
    </div>

    <div style={{display:"grid",gridTemplateColumns:tipoVehiculo==="carga"?"1fr 1fr":"1fr",gap:10}}>
      <Campo label="Tipo de vehículo">
        <select name="tipo_vehiculo" value={tipoVehiculo} onChange={e=>setTipoVehiculo(e.target.value)} style={est.input}>
          {TIPOS_VEHICULO.map(t=><option key={t} value={t}>{t}</option>)}
        </select>
      </Campo>
      {tipoVehiculo==="carga"&&<Campo label="Tipo de carga">
        <select name="tipo_carga" value={tipoCarga} onChange={e=>setTipoCarga(e.target.value)} style={est.input}>
          {TIPOS_CARGA.map(t=><option key={t} value={t}>{t}</option>)}
        </select>
      </Campo>}
    </div>

    {error&&<div style={{color:"#dc2626",fontSize:13,marginBottom:10}}>{error}</div>}
    <div style={{display:"flex",gap:10}}>
      <Boton type="submit" disabled={guardando}>{guardando?"Guardando...":"Guardar"}</Boton>
      <button type="button" onClick={onCancelar} style={est.linkBtn}>Cancelar</button>
    </div>
  </form>;
}

function VehiculosList({clienteId}){
  const[vehiculos,setVehiculos]=useState(null);
  const[polizasPorVehiculo,setPolizasPorVehiculo]=useState({});
  const[formAbierto,setFormAbierto]=useState(false);
  const[editando,setEditando]=useState(null);
  const[error,setError]=useState("");

  const cargar=async()=>{
    const{data,error}=await sb.from("vehiculos").select("*").eq("cliente_id",clienteId).order("created_at");
    if(error){setError(error.message);return;}
    setVehiculos(data);
    const{data:polizas}=await sb.from("polizas").select("*").eq("cliente_id",clienteId).not("vehiculo_id","is",null);
    const mapa={};
    (polizas||[]).forEach(p=>{
      const actual=mapa[p.vehiculo_id];
      if(!actual||(p.fecha_fin||"")>(actual.fecha_fin||""))mapa[p.vehiculo_id]=p;
    });
    setPolizasPorVehiculo(mapa);
  };
  useEffect(()=>{cargar()},[]);

  const eliminar=async(vehiculo)=>{
    if(!window.confirm(`¿Eliminar el vehículo ${vehiculo.placas||""}?`.trim()))return;
    const{error}=await sb.from("vehiculos").delete().eq("id",vehiculo.id);
    if(error){setError(error.message);return;}
    cargar();
  };

  const limite=vehiculos&&vehiculos.length>=5;

  return <div style={{marginBottom:32}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
      <div style={{fontSize:16,fontWeight:700}}>Vehículos {vehiculos?`(${vehiculos.length}/5)`:""}</div>
      {!formAbierto&&!editando&&!limite&&<Boton color="#53647D" onClick={()=>setFormAbierto(true)}>+ Nuevo vehículo</Boton>}
    </div>

    {limite&&!formAbierto&&<div style={{fontSize:12,color:"#8FA0B4",marginBottom:10}}>Este cliente ya tiene el máximo de 5 vehículos.</div>}

    {formAbierto&&<VehiculoForm clienteId={clienteId}
      onGuardado={()=>{setFormAbierto(false);cargar();}}
      onCancelar={()=>setFormAbierto(false)}/>}

    {editando&&<VehiculoForm clienteId={clienteId} vehiculoExistente={editando}
      onGuardado={()=>{setEditando(null);cargar();}}
      onCancelar={()=>setEditando(null)}/>}

    {error&&<div style={{color:"#dc2626",fontSize:13,marginBottom:10}}>{error}</div>}
    {!vehiculos&&<div style={{color:"#6B7280",fontSize:14}}>Cargando...</div>}
    {vehiculos&&vehiculos.length===0&&!formAbierto&&<div style={{...est.card,textAlign:"center",color:"#6B7280"}}>
      Este cliente todavía no tiene vehículos registrados.
    </div>}
    {vehiculos&&vehiculos.length>0&&<div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(220px,1fr))",gap:10}}>
      {vehiculos.map(veh=>{
        const poliza=polizasPorVehiculo[veh.id];
        const vig=poliza?vigenciaCalculada(poliza):null;
        return <div key={veh.id} style={est.card}>
          <div style={{fontWeight:700,fontSize:14}}>{veh.marca||"—"} {veh.modelo||""} {veh.anio||""}</div>
          <div style={{fontSize:12,color:"#8FA0B4",marginTop:2}}>{veh.placas||"Sin placas"}{veh.estado?` · ${veh.estado}`:""}</div>
          <div style={{fontSize:12,color:"#374151",marginTop:6}}>
            {veh.tipo_vehiculo}{veh.tipo_vehiculo==="carga"&&veh.tipo_carga?` (tipo ${veh.tipo_carga})`:""}
          </div>
          {veh.fecha_verificacion&&<div style={{fontSize:12,color:"#374151",marginTop:2}}>Verificación: {fecha(veh.fecha_verificacion)}</div>}
          <div style={{marginTop:8,paddingTop:8,borderTop:"1px solid #f1f5f9"}}>
            {poliza
              ?<div>
                <span style={est.badge(colorEstatus[vig.label]||"#6b7280")}>{vig.label}</span>
                {vig.dias!=null&&<div style={{fontSize:12,color:vig.dias<0?"#dc2626":vig.dias<=15?"#F59E0B":"#8FA0B4",marginTop:4,fontWeight:600}}>{textoDias(vig.dias)}</div>}
              </div>
              :<div style={{fontSize:12,color:"#8FA0B4"}}>Sin póliza de auto vinculada</div>}
          </div>
          <div style={{display:"flex",gap:4,marginTop:10}}>
            <button onClick={()=>setEditando(veh)} style={est.linkBtn}>Editar</button>
            <button onClick={()=>eliminar(veh)} style={{...est.linkBtn,color:"#dc2626"}}>Eliminar</button>
          </div>
        </div>;
      })}
    </div>}
  </div>;
}

function LigaMagica({cliente,onClienteCambiado}){
  const[copiado,setCopiado]=useState(false);
  const[regenerando,setRegenerando]=useState(false);
  const[reseteando,setReseteando]=useState(false);
  const[codigo,setCodigo]=useState(null);
  const[pidiendo,setPidiendo]=useState(false);
  const[error,setError]=useState("");
  const url=`${location.origin}/p/${cliente.token_publico}`;

  const verCodigo=async()=>{
    setPidiendo(true);setError("");
    const{data,error:err}=await sb.rpc("promotoria_codigo_activacion",{p_cliente_id:cliente.id});
    setPidiendo(false);
    if(err){setError(err.message);return;}
    setCodigo(data.codigo);
  };

  // "Olvidé mi NIP" del cliente: lo borramos y él crea uno nuevo la próxima vez que entre.
  // También se le caen los dispositivos recordados, por si el olvido fue por perder el teléfono.
  const resetearNip=async()=>{
    if(!window.confirm(`¿Restablecer el NIP de ${cliente.nombre.split(" ")[0]}? Va a crear uno nuevo la próxima vez que entre, y los dispositivos donde estaba recordado van a pedirlo otra vez.`))return;
    setReseteando(true);setError("");
    const{error:err}=await sb.rpc("promotoria_resetear_nip",{p_cliente_id:cliente.id});
    if(err){setReseteando(false);setError(err.message);return;}
    const{data}=await sb.from("clientes").select("*").eq("id",cliente.id).single();
    setReseteando(false);
    if(data)onClienteCambiado(data);
  };

  const copiar=async()=>{
    try{await navigator.clipboard.writeText(url);setCopiado(true);setTimeout(()=>setCopiado(false),2000);}
    catch(e){setError("No se pudo copiar. Selecciona el link a mano.");}
  };

  const regenerar=async()=>{
    if(!window.confirm("¿Regenerar la liga? La liga anterior deja de funcionar de inmediato."))return;
    setRegenerando(true);setError("");
    const{data,error}=await sb.from("clientes").update({token_publico:crypto.randomUUID()}).eq("id",cliente.id).select().single();
    setRegenerando(false);
    if(error){setError(error.message);return;}
    onClienteCambiado(data);
  };

  return <div style={{...est.card,marginBottom:24,background:"#F4F7FB"}}>
    <div style={{fontSize:13,fontWeight:700,color:"#8FA0B4",marginBottom:8}}>LIGA MÁGICA DEL CLIENTE</div>
    <div style={{fontSize:13,color:"#374151",marginBottom:10,lineHeight:1.5}}>
      Compártele esta liga a {cliente.nombre.split(" ")[0]} — ahí ve sus pólizas, PDFs y vehículos sin necesidad de registrarse.
    </div>
    <div style={{background:"#fff",border:"1px solid #DDE4EE",borderRadius:10,padding:"10px 12px",fontSize:13,wordBreak:"break-all",marginBottom:10}}>{url}</div>

    <div style={{fontSize:12.5,color:"#374151",marginBottom:10}}>
      {cliente.nip_definido_en
        ? <span>🔒 Protegida con el NIP que {cliente.nombre.split(" ")[0]} creó el {fecha(cliente.nip_definido_en.slice(0,10))}.</span>
        : cliente.correo
          ? <span style={{color:"#B45309"}}>Todavía sin NIP. Al abrir la liga le mandamos un código a {cliente.correo} para que cree el suyo.</span>
          : <span style={{color:"#B45309"}}>Todavía sin NIP. Como no tiene correo cargado, vas a tener que dictarle tú el código.</span>}
    </div>

    {!cliente.nip_definido_en&&!cliente.correo&&<div style={{marginBottom:10}}>
      {codigo
        ? <div style={{background:"#fff",border:"1.5px solid #F59E0B",borderRadius:10,padding:"10px 12px"}}>
            <div style={{fontSize:11,fontWeight:700,color:"#8FA0B4"}}>CÓDIGO PARA {cliente.nombre.split(" ")[0].toUpperCase()}</div>
            <div style={{fontSize:26,fontWeight:800,letterSpacing:6,color:"#10284A"}}>{codigo}</div>
            <div style={{fontSize:11.5,color:"#6B7280"}}>Dícteselo por teléfono. Vence en 24 horas y solo sirve una vez.</div>
          </div>
        : <button onClick={verCodigo} disabled={pidiendo} style={est.linkBtn}>{pidiendo?"Generando...":"Ver código de activación"}</button>}
    </div>}

    {error&&<div style={{color:"#dc2626",fontSize:13,marginBottom:10}}>{error}</div>}
    <div style={{display:"flex",gap:10,flexWrap:"wrap",alignItems:"center"}}>
      <Boton color="#53647D" onClick={copiar}>{copiado?"¡Copiada!":"Copiar liga"}</Boton>
      {cliente.nip_definido_en&&<button onClick={resetearNip} disabled={reseteando} style={est.linkBtn}>{reseteando?"Restableciendo...":"Olvidó su NIP"}</button>}
      <button onClick={regenerar} disabled={regenerando} style={est.linkBtn}>{regenerando?"Regenerando...":"Regenerar liga"}</button>
    </div>
  </div>;
}

function ClienteDetalle({cliente,promotoriaId,onVolver,onClienteCambiado}){
  const[editando,setEditando]=useState(false);
  const[borrando,setBorrando]=useState(false);
  const[error,setError]=useState("");
  const[versionVehiculos,setVersionVehiculos]=useState(0);

  const eliminar=async()=>{
    if(!window.confirm(`¿Eliminar a ${cliente.nombre}? Esto también borra sus vehículos, pólizas y solicitudes registradas.`))return;
    setBorrando(true);
    const{data:polizas}=await sb.from("polizas").select("pdf_path").eq("cliente_id",cliente.id).not("pdf_path","is",null);
    if(polizas&&polizas.length>0){
      await sb.storage.from("polizas").remove(polizas.map(p=>p.pdf_path));
    }
    const{data:solicitudes}=await sb.from("solicitudes").select("foto_path").eq("cliente_id",cliente.id).not("foto_path","is",null);
    if(solicitudes&&solicitudes.length>0){
      await sb.storage.from("solicitudes").remove(solicitudes.map(s=>s.foto_path));
    }
    const{error}=await sb.from("clientes").delete().eq("id",cliente.id);
    setBorrando(false);
    if(error){setError(error.message);return;}
    onClienteCambiado(null);
  };

  return <div>
    <button onClick={onVolver} style={{...est.linkBtn,padding:0,marginBottom:16}}>‹ Todos mis clientes</button>

    {editando
      ?<ClienteForm promotoriaId={promotoriaId} clienteExistente={cliente}
          onGuardado={(actualizado)=>{setEditando(false);onClienteCambiado(actualizado);}}
          onCancelar={()=>setEditando(false)}/>
      :<div style={{...est.card,marginBottom:24}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
          <div>
            <div style={{fontSize:18,fontWeight:700}}>{cliente.nombre}</div>
            <div style={{fontSize:13,color:"#8FA0B4",marginTop:2}}>{cliente.tipo_persona==="moral"?"Persona moral":"Persona física"}</div>
          </div>
          <div style={{display:"flex",gap:4}}>
            <button onClick={()=>setEditando(true)} style={est.linkBtn}>Editar</button>
            <button onClick={eliminar} disabled={borrando} style={{...est.linkBtn,color:"#dc2626"}}>{borrando?"Borrando...":"Eliminar"}</button>
          </div>
        </div>
        <div style={{marginTop:14,fontSize:13,color:"#374151",lineHeight:1.8}}>
          {cliente.rfc&&<div>RFC: {cliente.rfc}</div>}
          {cliente.curp&&<div>CURP: {cliente.curp}</div>}
          {cliente.fecha_nacimiento&&<div>Cumpleaños: {fecha(cliente.fecha_nacimiento)}</div>}
          {cliente.correo&&<div>Correo: {cliente.correo}</div>}
          {cliente.telefono&&<div>Teléfono: {cliente.telefono}</div>}
          {cliente.notas&&<div>Notas: {cliente.notas}</div>}
        </div>
        {error&&<div style={{color:"#dc2626",fontSize:13,marginTop:10}}>{error}</div>}
      </div>}

    <LigaMagica cliente={cliente} onClienteCambiado={onClienteCambiado}/>

    <VehiculosList key={versionVehiculos} clienteId={cliente.id}/>
    <PolizasList clienteId={cliente.id} promotoriaId={promotoriaId} onPolizaCambiada={()=>setVersionVehiculos(v=>v+1)}/>
    <SiniestrosList clienteId={cliente.id}/>
  </div>;
}
